                        <span className={`rounded border px-1.5 py-0.5 text-[10px] font-extrabold ${st.cls}`}>{st.label}</span>
                        {isManagerMatch(m) && <span className="rounded border border-brand/50 bg-brand/20 px-1.5 py-0.5 text-[10px] font-black text-brand">✨ 신규 개설</span>}
                        {meIn && <span className="rounded bg-neon/15 px-1.5 py-0.5 text-[10px] font-extrabold text-neon">내 캐릭터 참가</span>}
                      </div>
                      <div className="truncate font-extrabold">{m.title}</div>
                      <div className="mt-0.5 text-[11px] font-semibold text-white/60">{fmtDateFull(m.datetime)} · {m.court}</div>
                      <div className="truncate text-[11px] text-white/45"><Icon name="MapPin" size={11} className="mr-0.5 inline text-brand" />{getCourtAddress(m, state)}</div>
                      <div className="text-[11px] text-white/45">{m.format} · {m.manager} · {isUnlimitedMatch(m) ? <span className="font-bold text-neon">참가 {m.participants.length}명 · 인원 무제한(오픈런)</span> : `${m.participants.length}/${m.maxPlayers}명`}</div>
                    </div>
                    {['open', 'closed', 'cancelled'].includes(m.status) && (
                      <button onClick={() => { if (confirm('이 매치를 삭제할까요?')) { dispatch({ type: 'DELETE_MATCH', matchId: m.id }); toast('매치가 삭제되었습니다', 'admin'); } }} title="매치 삭제" className="rounded-lg p-1.5 text-white/30 hover:bg-red-500/10 hover:text-red-400"><Icon name="Trash2" size={15} /></button>
                    )}
                  </div>

                  {/* 실시간 참가 신청자 명단 & 포지션 현황판 상시 노출 */}
                  <MatchParticipantRoster match={m} />

                  <div className="mt-3 flex flex-wrap gap-2">
                    {m.status === 'open' && (isUnlimitedMatch(m) || m.participants.length < m.maxPlayers) && (
                      <Btn variant="ghost" className="px-3 py-2 text-xs" onClick={() => { dispatch({ type: 'FILL_BOTS', matchId: m.id }); toast('게스트 선수로 인원을 추가했습니다', 'admin'); }}><Icon name="UserPlus" size={14} /> 게스트 채우기</Btn>
                    )}
                    {m.status === 'open' && <Btn variant="ghost" className="px-3 py-2 text-xs" onClick={() => setStatus(m, 'closed')}><Icon name="Lock" size={14} /> 신청 마감</Btn>}
                    {m.status === 'closed' && <Btn variant="ghost" className="px-3 py-2 text-xs" onClick={() => setStatus(m, 'open')}><Icon name="LockOpen" size={14} /> 모집 재개</Btn>}
                    {(m.status === 'open' || m.status === 'closed') && (
                      <Btn className="flex-1 px-3 py-2 text-xs" onClick={() => setAssign(m.id)}><Icon name="Swords" size={14} /> 팀 배정 &amp; 경기 시작</Btn>
                    )}
                    {m.status === 'live' && <Btn variant="neon" className="flex-1 px-3 py-2 text-xs" onClick={() => goStatPad(m.id)}><Icon name="Gauge" size={14} /> 스탯 패드로 이동</Btn>}
                    {['open', 'closed', 'live'].includes(m.status) && (
                      <Btn variant="danger" className="px-3 py-2 text-xs" onClick={() => setStatus(m, 'cancelled')}><Icon name="Ban" size={14} /> {m.status === 'live' ? '경기 중단' : '경기 취소'}</Btn>
                    )}
                    {m.status === 'finished' && <Btn variant="ghost" className="flex-1 px-3 py-2 text-xs" onClick={() => setView(m.id)}><Icon name="FileChartColumn" size={14} /> 공식 결과 보기 ({m.result.scoreA}:{m.result.scoreB})</Btn>}
                    {m.status === 'cancelled' && <div className="flex-1 rounded-xl border border-red-500/20 bg-red-500/5 px-3 py-2 text-center text-xs font-bold text-red-400">취소된 매치 · 유저 로비 비노출</div>}
                  </div>
                </Card>
              );
            })}
          </div>
        </div>
      </div>
      {assignMatch && (assignMatch.status === 'open' || assignMatch.status === 'closed') && <TeamAssignModal match={assignMatch} onClose={() => setAssign(null)} onStarted={(id) => { setAssign(null); goStatPad(id); }} />}
      <Modal open={!!viewMatch} onClose={() => setView(null)} wide title="공식 경기 결과">{viewMatch && viewMatch.result && <ResultBody match={viewMatch} />}</Modal>
    </AdminGuard>
  );
}

/* =====================================================================
 * 14. ADMIN: REAL-TIME TOUCH STAT PAD
 * ===================================================================== */
const PAD = [
  { key: 'pts', amount: 1, label: '+1', kind: 'pts' },
  { key: 'pts', amount: 2, label: '+2', kind: 'pts' },
  { key: 'pts', amount: 3, label: '+3', kind: 'pts' },
  { key: 'ast', amount: 1, label: 'AST', kind: 'pos' },
  { key: 'reb', amount: 1, label: 'REB', kind: 'pos' },
  { key: 'stl', amount: 1, label: 'STL', kind: 'pos' },
  { key: 'blk', amount: 1, label: 'BLK', kind: 'pos' },
  { key: 'tov', amount: 1, label: 'TOV', kind: 'neg' },
  { key: 'pf', amount: 1, label: 'PF', kind: 'neg' },
];
const PAD_CLS = {
  pts: 'bg-brand text-black shadow-[0_0_16px_-4px_rgba(255,85,0,.8)] hover:brightness-110',
  pos: 'bg-neon/10 text-neon border border-neon/40 hover:bg-neon/20',
  neg: 'bg-red-500/10 text-red-400 border border-red-500/40 hover:bg-red-500/20',
};

function PlayerPadCard({ user, stats, jersey, team, onStat, onSubClick, subMode, canSub, isMe }) {
  const [fx, setFx] = useState([]);
  const pf = stats.pf;
  const trouble = pf >= 4;
  const fouledOut = pf >= 5;
  const abei = calcABEi(stats);
  const color = team === 'A' ? '#FF5500' : '#22D3EE';
  const press = (b) => {
    onStat(user.id, b.key, b.amount, b.label);
    vibrate(b.kind === 'neg' ? 30 : 10);
    const id = Math.random();
    setFx((f) => [...f.slice(-3), { id, text: b.kind === 'pts' ? b.label : `+${b.label}`, kind: b.kind }]);
    setTimeout(() => setFx((f) => f.filter((x) => x.id !== id)), 850);
  };
  return (
    <div className={`relative rounded-2xl border p-2.5 transition ${trouble ? 'foul-alert border-red-500 bg-red-500/[.08]' : subMode ? 'border-yellow-400/70 bg-yellow-400/[.06]' : 'border-white/[.07] bg-panel'}`}>
      {fx.map((f) => (
        <span key={f.id} className={`float-up pointer-events-none absolute left-1/2 top-3 z-10 font-bebas text-3xl ${f.kind === 'pts' ? 'text-brand text-glow-orange' : f.kind === 'pos' ? 'text-neon text-glow-neon' : 'text-red-400'}`}>{f.text}</span>
      ))}
      <div className="mb-2 flex items-center gap-2">
        <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg font-bebas text-xl text-black" style={{ background: color }}>{jersey}</div>
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-1.5">
            <span className="truncate text-sm font-extrabold">{user.nickname}</span>
            {isMe && <span className="rounded bg-neon px-1 text-[9px] font-black text-black">나</span>}
            <span className="text-[10px] font-bold" style={{ color: (POSITIONS[user.position] || POSITIONS.G).color }}>{user.position}</span>
          </div>
          <div className="flex flex-wrap gap-x-2 font-mono text-[10px] text-white/50">
            <span><b className="text-brand">{stats.pts}</b>P</span><span>{stats.reb}R</span><span>{stats.ast}A</span><span>{stats.stl}S</span><span>{stats.blk}B</span>
            <span className="text-red-400/80">{stats.tov}TO</span>
            <span className={trouble ? 'font-black text-red-400' : 'text-red-400/80'}>{stats.pf}PF</span>
          </div>
        </div>
        <div className="text-right">
          <div className="font-bebas text-lg leading-none text-white/80">{abei.toFixed(1)}</div>
          <div className="text-[8px] font-bold text-white/35">ABEi</div>
        </div>
        <button onClick={onSubClick} disabled={!canSub} title="교체"
          className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border transition disabled:opacity-25 ${subMode ? 'border-yellow-400 bg-yellow-400 text-black' : 'border-white/10 bg-white/5 text-white/60 hover:text-white'}`}>
          <Icon name="ArrowLeftRight" size={15} />
        </button>
      </div>
      {trouble && (
        <div className="mb-2 flex items-center gap-1.5 rounded-lg bg-red-500/20 px-2 py-1 text-[11px] font-extrabold text-red-300">
          <Icon name="TriangleAlert" size={13} /> {fouledOut ? `5반칙 퇴장 — 즉시 교체 필요 (PF ${pf})` : `파울 트러블 경고 (PF ${pf}) — 교체 고려`}
        </div>
      )}
      <div className="grid grid-cols-3 gap-1.5 sm:grid-cols-9">
        {PAD.map((b) => (
          <button key={b.label} onClick={() => press(b)}
            className={`stat-btn h-12 rounded-xl text-sm font-black sm:h-14 ${b.kind === 'pts' ? 'font-bebas text-2xl' : ''} ${PAD_CLS[b.kind]} ${b.key === 'pf' && trouble ? '!bg-red-500 !text-pure' : ''}`}>
            {b.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function TeamPanel({ m, team, subOut, setSubOut, onStat, className = '' }) {
  const { state, dispatch, toast } = useStore();
  const live = m.live;
  const ids = live.teams[team];
  const court = live.onCourt[team];
  const bench = ids.filter((id) => !court.includes(id));
  const color = team === 'A' ? '#FF5500' : '#22D3EE';
  const score = ids.reduce((s, id) => s + live.stats[id].pts, 0);
  const fouls = ids.reduce((s, id) => s + live.stats[id].pf, 0);
  const jersey = (id) => JERSEYS[ids.indexOf(id) % JERSEYS.length];
  const subActive = subOut && subOut.team === team;
  const doSub = (inId) => {
    dispatch({ type: 'SUB', matchId: m.id, team, outId: subOut.uid, inId });
    toast(`교체: ${state.users[subOut.uid].nickname} OUT → ${state.users[inId].nickname} IN`, 'admin');
    setSubOut(null);
  };
  return (
    <div className={className}>
      <div className="mb-2 flex items-center justify-between rounded-xl px-3 py-2" style={{ background: `${color}14`, border: `1px solid ${color}40` }}>
        <div className="flex items-center gap-2"><span className="font-bebas text-2xl" style={{ color }}>TEAM {team}</span><span className="text-[10px] text-white/45">{ids.length}명 엔트리</span></div>
        <div className="flex items-center gap-3 text-[11px] text-white/50"><span>팀파울 <b className={fouls >= 5 ? 'text-red-400' : 'text-white'}>{fouls}</b></span><span className="font-bebas text-2xl text-white">{score}</span></div>
      </div>
      <div className="space-y-2">
        {court.map((id) => (
          <PlayerPadCard key={id} user={state.users[id]} stats={live.stats[id]} jersey={jersey(id)} team={team} isMe={id === state.meId}
            onStat={onStat} canSub={bench.length > 0} subMode={subActive && subOut.uid === id}
            onSubClick={() => setSubOut(subActive && subOut.uid === id ? null : { team, uid: id })} />
        ))}
      </div>
      <div className={`mt-2 rounded-2xl border p-2.5 ${subActive ? 'border-yellow-400/60 bg-yellow-400/[.05]' : 'border-white/[.06] bg-panel/60'}`}>
        <div className="mb-2 flex items-center gap-1.5 text-[11px] font-bold text-white/50">
          <Icon name="Armchair" size={13} /> 벤치 ({bench.length})
          {subActive && <span className="ml-auto animate-pulse text-yellow-300">↓ 투입할 선수를 선택하세요</span>}
        </div>
        {bench.length === 0 ? <div className="py-1 text-center text-[11px] text-white/30">벤치 멤버 없음</div> : (
          <div className="grid grid-cols-2 gap-1.5">
            {bench.map((id) => {
              const u = state.users[id]; const s = live.stats[id];
              return (
                <button key={id} disabled={!subActive} onClick={() => doSub(id)}
                  className={`flex items-center gap-2 rounded-xl px-2 py-1.5 text-left transition ${subActive ? 'bg-yellow-400/15 ring-1 ring-yellow-400/60 hover:bg-yellow-400/25' : 'bg-ink/60'}`}>
                  <span className="flex h-6 w-6 items-center justify-center rounded-md font-bebas text-sm text-black" style={{ background: `${color}AA` }}>{jersey(id)}</span>
                  <span className="min-w-0 flex-1 truncate text-[11px] font-bold">{u.nickname}{id === state.meId && <span className="text-neon"> (나)</span>}</span>
                  <span className="font-mono text-[10px] text-white/40">{s.pts}P</span>
                  {subActive && <Icon name="LogIn" size={13} className="text-yellow-300" />}
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function StatPadPage({ matchId, setMatchId }) {
  const { state, dispatch, toast, goDashboard } = useStore();
  const lives = state.matches.filter((m) => m.status === 'live');
  const m = lives.find((x) => x.id === matchId) || lives[0];
  const [mobileTeam, setMobileTeam] = useState('A');
  const [subOut, setSubOut] = useState(null);
  const [confirmOpen, setConfirmOpen] = useState(false);
  const [resultId, setResultId] = useState(null);
  const [sec, setSec] = useState(600);
  const [running, setRunning] = useState(false);
  const [q, setQ] = useState(1);
  const [bump, setBump] = useState({ A: 0, B: 0 });

  useEffect(() => {
    if (!running) return;
    const t = setInterval(() => setSec((s) => Math.max(0, s - 1)), 1000);
    return () => clearInterval(t);
  }, [running]);
  useEffect(() => { if (sec === 0) setRunning(false); }, [sec]);
  useEffect(() => { setSubOut(null); }, [m && m.id]);

  const resultMatch = state.matches.find((x) => x.id === resultId);

  if (!m) {
    return (
      <AdminGuard>
        <Card className="flex flex-col items-center gap-3 py-16 text-center">
          <Icon name="Gauge" size={38} className="text-white/20" />
          <div className="font-extrabold">진행 중인 경기가 없습니다</div>
          <div className="text-xs text-white/45">[매치 콘솔]에서 팀 배정 후 경기를 시작하면 스탯 패드가 활성화됩니다.</div>
        </Card>
        <Modal open={!!resultMatch} onClose={() => setResultId(null)} wide title="🏁 공식 기록 전송 완료">
          {resultMatch && resultMatch.result && <ResultBody match={resultMatch} onDashboard={() => { setResultId(null); goDashboard(); }} />}
        </Modal>
      </AdminGuard>
    );
  }

  const live = m.live;
  const score = (t) => live.teams[t].reduce((s, id) => s + live.stats[id].pts, 0);
  const sA = score('A'), sB = score('B');
  const lastAction = live.undo[live.undo.length - 1];
  const actionLabel = (a) => {
    const p = PAD.find((b) => b.key === a.key && b.amount === a.amount) || { label: STAT_LABEL[a.key] };
    return `${state.users[a.uid].nickname} ${a.key === 'pts' ? `${p.label}점` : STAT_KO[a.key]}`;
  };
  const onStat = (uid, key, amount) => {
    dispatch({ type: 'STAT', matchId: m.id, uid, key, amount });
    if (key === 'pts') {
      const t = live.teams.A.includes(uid) ? 'A' : 'B';
      setBump((b) => ({ ...b, [t]: b[t] + 1 }));
    }
    if (key === 'pf' && live.stats[uid].pf + 1 === 4) toast(`⚠ ${state.users[uid].nickname} 파울 트러블 (4반칙)`, 'error');
    if (key === 'pf' && live.stats[uid].pf + 1 === 5) toast(`🚫 ${state.users[uid].nickname} 5반칙 퇴장! 교체가 필요합니다`, 'error');
  };
  const undo = () => {
    if (!lastAction) return;
    dispatch({ type: 'UNDO', matchId: m.id });
    toast(`입력 취소: ${actionLabel(lastAction)}`);
    vibrate(20);
  };
  const submit = () => {
    const id = m.id;
    dispatch({ type: 'SUBMIT', matchId: id });
    setConfirmOpen(false);
    setRunning(false);
    setResultId(id);
    toast('공식 기록 전송 완료 · 알고리즘 엔진이 전체 선수 레이팅을 갱신했습니다', 'success');
  };

  return (
    <AdminGuard>
      <div className="space-y-3">
        {lives.length > 1 && (
          <div className="no-scrollbar flex gap-2 overflow-x-auto">
            {lives.map((x) => (
              <button key={x.id} onClick={() => setMatchId(x.id)} className={`shrink-0 rounded-full px-3 py-1.5 text-xs font-bold ${x.id === m.id ? 'bg-brand text-black' : 'bg-white/5 text-white/60'}`}>● {x.title}</button>
            ))}
          </div>
        )}

        {/* Central controller / scoreboard */}
        <div className="sticky top-[86px] z-30 -mx-4 px-4 pb-1 pt-1">
          <div className="overflow-hidden rounded-2xl border border-white/10 bg-panel/95 shadow-2xl backdrop-blur-xl">
            <div className="flex items-center justify-between border-b border-white/5 px-3 py-1.5 text-[10px] font-bold text-white/40">
              <span className="flex items-center gap-1.5 truncate"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-red-500" /> LIVE · {m.title}</span>
              <span className="hidden sm:inline">{m.court}</span>
            </div>
            <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 px-3 py-2">
              <div className="flex items-center justify-end gap-3">
                <div className="text-right"><div className="font-bebas text-lg leading-none text-brand">TEAM A</div><div className="text-[10px] text-white/40">HOME</div></div>
                <div key={`a${bump.A}`} className="score-bump w-[72px] text-center font-bebas text-6xl leading-none text-brand text-glow-orange sm:w-24 sm:text-7xl">{sA}</div>
              </div>
              <div className="flex flex-col items-center">
                <div className="flex items-center gap-1">
                  {[1, 2, 3, 4].map((n) => (
                    <button key={n} onClick={() => setQ(n)} className={`rounded px-1.5 text-[10px] font-black ${q === n ? 'bg-white text-ink' : 'text-white/35'}`}>{n}Q</button>
                  ))}
                </div>
                <div className={`font-bebas text-3xl leading-none ${sec <= 60 ? 'text-red-400' : 'text-white'}`}>{pad2(Math.floor(sec / 60))}:{pad2(sec % 60)}</div>
                <div className="flex gap-1">
                  <button onClick={() => setRunning(!running)} className="rounded-md bg-white/10 p-1 hover:bg-white/20">{running ? <Icon name="Pause" size={13} /> : <Icon name="Play" size={13} />}</button>
                  <button onClick={() => { setRunning(false); setSec(600); }} className="rounded-md bg-white/10 p-1 hover:bg-white/20"><Icon name="TimerReset" size={13} /></button>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div key={`b${bump.B}`} className="score-bump w-[72px] text-center font-bebas text-6xl leading-none text-teamb text-glow-cyan sm:w-24 sm:text-7xl">{sB}</div>
                <div><div className="font-bebas text-lg leading-none text-teamb">TEAM B</div><div className="text-[10px] text-white/40">AWAY</div></div>
              </div>
            </div>
            <div className="flex items-center gap-2 border-t border-white/5 px-3 py-2">
              <button onClick={undo} disabled={!lastAction}
                className="flex shrink-0 items-center gap-1.5 rounded-xl border border-yellow-400/40 bg-yellow-400/10 px-3 py-2.5 text-xs font-extrabold text-yellow-300 transition hover:bg-yellow-400/20 active:scale-95 disabled:opacity-30">
                <Icon name="Undo2" size={15} /> <span className="hidden sm:inline">직전 입력 취소</span><span className="sm:hidden">취소</span>
                <span className="rounded bg-yellow-400/20 px-1 font-mono text-[10px]">{live.undo.length}</span>
              </button>
              <div className="min-w-0 flex-1 truncate text-center text-[11px] text-white/45">
                {lastAction ? <>최근: <b className="text-white/80">{actionLabel(lastAction)}</b></> : '입력 대기 중 · 버튼을 탭해 기록하세요'}
              </div>
              <button onClick={() => setConfirmOpen(true)}
                className="flex shrink-0 items-center gap-1.5 rounded-xl bg-neon px-3 py-2.5 text-xs font-black text-black transition glow-neon hover:brightness-110 active:scale-95">
                <Icon name="Save" size={15} /> <span className="hidden sm:inline">경기 종료 및 공식 기록 전송</span><span className="sm:hidden">종료·전송</span>
              </button>
            </div>
          </div>
        </div>

        {/* Mobile/portrait team switcher */}
        <div className="grid grid-cols-2 gap-2 lg:hidden">
          {['A', 'B'].map((t) => (
            <button key={t} onClick={() => setMobileTeam(t)}
              className={`rounded-xl py-2.5 font-bebas text-xl transition ${mobileTeam === t ? (t === 'A' ? 'bg-brand text-black' : 'bg-teamb text-black') : 'bg-white/5 text-white/50'}`}>
              TEAM {t} · {t === 'A' ? sA : sB}
            </button>
          ))}
        </div>

        <div className="grid gap-4 lg:grid-cols-2">
          <TeamPanel m={m} team="A" subOut={subOut} setSubOut={setSubOut} onStat={onStat} className={mobileTeam === 'A' ? '' : 'hidden lg:block'} />
          <TeamPanel m={m} team="B" subOut={subOut} setSubOut={setSubOut} onStat={onStat} className={mobileTeam === 'B' ? '' : 'hidden lg:block'} />
        </div>
        <p className="pb-2 text-center text-[11px] text-white/30">💡 태블릿 가로 모드에서 양 팀 패드가 동시에 표시됩니다 · 모든 입력은 실시간 저장 (새로고침해도 유지)</p>
      </div>

      <Modal open={confirmOpen} onClose={() => setConfirmOpen(false)} title="경기 종료 및 공식 기록 전송">
        <div className="p-5">
          <div className="flex items-center justify-center gap-6 py-2">
            <div className="text-center"><div className="font-bebas text-lg text-brand">TEAM A</div><div className="font-bebas text-6xl leading-none">{sA}</div></div>
            <div className="font-bebas text-2xl text-white/30">VS</div>
            <div className="text-center"><div className="font-bebas text-lg text-teamb">TEAM B</div><div className="font-bebas text-6xl leading-none">{sB}</div></div>
          </div>
          <div className="mt-2 text-center text-sm font-bold">{sA === sB ? '무승부로 기록됩니다' : `TEAM ${sA > sB ? 'A' : 'B'} 승리`}</div>
          <div className="mt-4 space-y-1.5 rounded-xl bg-ink p-3 text-[11px] text-white/55">
            <div className="flex gap-2"><Icon name="Cpu" size={13} className="text-neon" /> 전송 즉시 아래 파이프라인이 실행됩니다</div>
            <div>① 전 선수 ABEi 산출 → ② 팀 평균(실제 출전 인원) 대비 가중치 0.5~1.5</div>
            <div>③ 승리 +25×w / 패배 −20÷w 레이팅 갱신 → ④ 티어 · 칭호 자동 갱신</div>
            <div className="text-yellow-300/80">⚠ 전송 후에는 수정할 수 없는 공식 기록으로 확정됩니다.</div>
          </div>
          <div className="mt-4 grid grid-cols-2 gap-2">
            <Btn variant="ghost" onClick={() => setConfirmOpen(false)}>계속 기록</Btn>
            <Btn variant="neon" onClick={submit}><Icon name="Send" size={15} /> 공식 기록 전송</Btn>
          </div>
        </div>
      </Modal>
      <Modal open={!!resultMatch} onClose={() => setResultId(null)} wide title="🏁 공식 기록 전송 완료">
        {resultMatch && resultMatch.result && <ResultBody match={resultMatch} onDashboard={() => { setResultId(null); goDashboard(); }} />}
      </Modal>
    </AdminGuard>
  );
}

/* =====================================================================
 * 15. RESULT VIEW & RECORDS
 * ===================================================================== */
function ResultBody({ match, onDashboard }) {
  const { state } = useStore();
  const r = match.result;
  const meRow = r.rows.find((x) => x.id === state.meId);
  return (
    <div className="p-5">
      <div className="flex items-center justify-center gap-5">
        <div className="text-center"><div className="font-bebas text-lg text-brand">TEAM A</div><div className={`font-bebas text-6xl leading-none ${r.winner === 'A' ? 'text-white' : 'text-white/40'}`}>{r.scoreA}</div>{r.winner === 'A' && <div className="text-[10px] font-black text-neon">WIN</div>}</div>
        <div className="text-center"><div className="font-bebas text-xl text-white/30">FINAL</div><div className="text-[10px] text-white/35">{fmtShort(match.datetime)}</div></div>
        <div className="text-center"><div className="font-bebas text-lg text-teamb">TEAM B</div><div className={`font-bebas text-6xl leading-none ${r.winner === 'B' ? 'text-white' : 'text-white/40'}`}>{r.scoreB}</div>{r.winner === 'B' && <div className="text-[10px] font-black text-neon">WIN</div>}</div>
      </div>
      {meRow && (
        <div className="mt-4 flex items-center gap-3 rounded-xl border border-neon/30 bg-neon/[.06] p-3">
          <Avatar user={state.users[state.meId]} size={36} ring />
          <div className="min-w-0 flex-1 text-xs">
            <div className="font-extrabold">내 캐릭터 결과 · {meRow.result === 'W' ? '승리' : meRow.result === 'L' ? '패배' : '무승부'}</div>
            <div className="text-white/50">ABEi {meRow.abei.toFixed(1)} · 가중치 ×{meRow.weight.toFixed(2)} · {meRow.before} → <b className="text-white">{meRow.after}</b>{meRow.tierAfter !== meRow.tierBefore && <b className="ml-1 text-neon">🚀 {getTier(meRow.after).name} 승급!</b>}</div>
          </div>
          <DeltaChip delta={meRow.delta} />
        </div>
      )}
      {['A', 'B'].map((t) => (
        <div key={t} className="mt-4">
          <div className="mb-1.5 flex items-center justify-between text-xs font-bold">
            <span className={t === 'A' ? 'text-brand' : 'text-teamb'}>TEAM {t} {r.winner === t ? '· 승리 🏆' : r.winner === 'D' ? '· 무승부' : '· 패배'}</span>
            <span className="text-white/40">팀 평균 ABEi {r.teamAvgs ? r.teamAvgs[t].toFixed(2) : '-'} ({r.rows.filter((x) => x.team === t).length}명)</span>
          </div>
          <div className="overflow-x-auto rounded-xl border border-white/5">
            <table className="w-full min-w-[560px] text-[11px]">
              <thead className="bg-white/[.03] text-white/40">
                <tr>{['선수', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TOV', 'PF', 'ABEi', 'weight', 'Δ PT', '레이팅'].map((h) => <th key={h} className="px-2 py-2 text-center font-bold first:text-left">{h}</th>)}</tr>
              </thead>
              <tbody className="divide-y divide-white/5">
                {r.rows.filter((x) => x.team === t).sort((a, b) => b.delta - a.delta).map((x) => (
                  <tr key={x.id} className={x.id === state.meId ? 'bg-neon/[.06]' : ''}>
                    <td className="px-2 py-2 font-bold"><span className="whitespace-nowrap">{x.nickname}{x.id === state.meId && <span className="ml-1 text-neon">(나)</span>}</span></td>
                    {STAT_KEYS.map((k) => <td key={k} className={`px-2 py-2 text-center font-mono ${k === 'pts' ? 'font-bold text-brand' : (k === 'pf' && x.stats.pf >= 4) ? 'text-red-400' : 'text-white/70'}`}>{x.stats[k]}</td>)}
                    <td className="px-2 py-2 text-center font-mono font-bold">{x.abei.toFixed(1)}</td>
                    <td className="px-2 py-2 text-center font-mono text-yellow-300">×{x.weight.toFixed(2)}</td>
                    <td className={`px-2 py-2 text-center font-bebas text-base ${x.delta >= 0 ? 'text-neon' : 'text-red-400'}`}>{signed(x.delta)}</td>
                    <td className="whitespace-nowrap px-2 py-2 text-center"><span className="font-bebas text-base">{x.after}</span> {x.tierAfter !== x.tierBefore && <span className="text-[9px] font-black" style={{ color: getTier(x.after).color }}>{tierIndex(x.tierAfter) > tierIndex(x.tierBefore) ? '▲' : '▼'}{getTier(x.after).name}</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}
      <div className="mt-4 rounded-xl bg-ink p-3 font-mono text-[10px] leading-relaxed text-white/45">
        ABEi = PTS + 1.5·REB + 2·AST + 2·STL + 2·BLK − 2·TOV − PF<br />
        weight = clip(ABEi ÷ 팀평균ABEi, 0.5, 1.5) · 승리 Δ = +25 × w · 패배 Δ = −20 ÷ w
      </div>
      {onDashboard && meRow && (
        <Btn variant="neon" className="mt-4 w-full py-3.5" onClick={onDashboard}><Icon name="ChartLine" size={16} /> 유저 앱에서 내 대시보드 확인하기 <Icon name="ExternalLink" size={14} /></Btn>
      )}
    </div>
  );
}

function RecordsPage() {
  const { state } = useStore();
  const done = state.matches.filter((m) => m.status === 'finished').sort((a, b) => (b.result?.submittedAt || 0) - (a.result?.submittedAt || 0));
  const [open, setOpen] = useState(done[0]?.id || null);
  return (
    <AdminGuard>
      <div className="space-y-4">
        <Card className="p-4">
          <SectionTitle icon="Cpu" title="코어 알고리즘 엔진 명세" sub="ABEi + TrueSkill 기반 다이내믹 레이팅" />
          <div className="grid gap-2 text-[11px] md:grid-cols-4">
            {[
              ['① ABEi 산출', 'PTS + 1.5·REB + 2·AST + 2·STL + 2·BLK − 2·TOV − 1·PF'],
              ['② 팀 평균 · 가중치', 'Σ ABEi ÷ 실제 출전 인원 → w = clip(개인 ÷ 평균, 0.5, 1.5)'],
              ['③ 레이팅 갱신', '승리 +25 × w (하드캐리 보상) · 패배 −20 ÷ w (스탯 손실 방어)'],
              ['④ 티어 · 칭호', TIERS.map((t) => `${t.name} ${t.min}+`).join(' → ')],
            ].map(([k, v]) => (
              <div key={k} className="rounded-xl bg-ink/70 p-3"><div className="mb-1 font-extrabold text-brand">{k}</div><div className="font-mono leading-relaxed text-white/60">{v}</div></div>
            ))}
          </div>
        </Card>
        <SectionTitle icon="History" title="공식 경기 기록 로그" sub={`총 ${done.length}경기`} />
        {done.length === 0 && <Card className="py-12 text-center text-sm text-white/40">아직 전송된 공식 기록이 없습니다</Card>}
        {done.map((m) => (
          <Card key={m.id} className="overflow-hidden">
            <button onClick={() => setOpen(open === m.id ? null : m.id)} className="flex w-full items-center gap-3 p-4 text-left">
              <div className="font-bebas text-3xl"><span className="text-brand">{m.result.scoreA}</span><span className="text-white/30">:</span><span className="text-teamb">{m.result.scoreB}</span></div>
              <div className="min-w-0 flex-1"><div className="truncate font-bold">{m.title}</div><div className="text-[11px] text-white/40">{fmtDateFull(m.datetime)} · 전송 {fmtTime(m.result.submittedAt)} · {m.result.rows.length}명 갱신</div></div>
              <Icon name="ChevronDown" size={18} className={`text-white/40 transition ${open === m.id ? 'rotate-180' : ''}`} />
            </button>
            {open === m.id && <div className="border-t border-white/5"><ResultBody match={m} /></div>}
          </Card>
        ))}
      </div>
    </AdminGuard>
  );
}

/* =====================================================================
 * 16. APP ROOT (매니저 콘솔 · 다크/라이트 테마 지원)
 * ===================================================================== */
function AdminApp() {
  const [state, dispatch] = useReducer(reducer, null, loadState);
  const [authed, setAuthed] = useState(() => { try { return sessionStorage.getItem(ADMIN_SESSION_KEY) === '1'; } catch (e) { return false; } });
  const [tab, setTabRaw] = useState('console');
  const [statMatchId, setStatMatchId] = useState(null);
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('gt_theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } });
  const [toasts, setToasts] = useState([]);

  useSharedPersistence(state, dispatch, setTheme);

  useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('gt_theme', theme); } catch (e) {}
    const meta = document.getElementById('meta-theme');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#F8FAFC' : '#121212');
  }, [theme]);

  const toast = useCallback((msg, type = 'info') => {
    const id = Math.random();
    setToasts((t) => [...t.slice(-2), { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2600);
  }, []);
  const setTab = useCallback((t) => { setTabRaw(t); window.scrollTo({ top: 0, behavior: 'smooth' }); }, []);
  const goStatPad = (id) => { setStatMatchId(id); setTab('statpad'); };
  // 결과 확인: 유저 앱(index.html)의 마이페이지를 별도 탭으로 열기 (같은 탭 이름 재사용)
  const goDashboard = useCallback(() => { window.open('index.html#my', 'garbagetime_user'); }, []);
  const onAuth = useCallback(() => {
    try { sessionStorage.setItem(ADMIN_SESSION_KEY, '1'); } catch (e) {}
    setAuthed(true);
    toast('직원 인증 완료 · 백오피스 권한이 활성화되었습니다', 'admin');
  }, []);
  const lock = () => {
    try { sessionStorage.removeItem(ADMIN_SESSION_KEY); } catch (e) {}
    setAuthed(false);
  };

  const ctx = { state, dispatch, mode: 'admin', tab, setTab, toast, goDashboard, theme, setTheme };

  let screen;
  if (!authed) screen = <PinGate onSuccess={onAuth} />;
  else {
    let page;
    if (tab === 'statpad') page = <StatPadPage matchId={statMatchId} setMatchId={setStatMatchId} />;
    else if (tab === 'records') page = <RecordsPage />;
    else page = <ConsolePage goStatPad={goStatPad} />;
    screen = (
      <div className="court-bg min-h-[100dvh]">
        <AdminHeader onLock={lock} />
        <main key={tab} className="fade-in mx-auto max-w-7xl px-4 pb-28 pt-4">{page}</main>
        <AdminNav />
      </div>
    );
  }

  return (
    <Store.Provider value={ctx}>
      {screen}
      <Toasts items={toasts} />
    </Store.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div style={{ padding: 24, color: '#fff', background: '#121212', minHeight: '100vh', fontFamily: 'sans-serif' }}>
          <h2 style={{ color: '#FF5500' }}>문제가 발생했습니다</h2>
          <pre style={{ whiteSpace: 'pre-wrap', fontSize: 12, opacity: .7 }}>{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
          <button style={{ marginTop: 12, padding: '10px 16px', background: '#FF5500', border: 0, borderRadius: 10, fontWeight: 800 }}
            onClick={() => { localStorage.removeItem(STORAGE_KEY); location.reload(); }}>데이터 초기화 후 새로고침</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><AdminApp /></ErrorBoundary>);
</script>
</body>
</html>
