function Icon({ name, size = 18, className = '', strokeWidth = 2, fill = 'none', style }) {
  const lib = window.lucide && (window.lucide.icons || window.lucide);
  const ALIAS = {
    UserPen: ['UserPen', 'UserCog', 'SquarePen', 'Pencil', 'Edit3', 'User'],
    Edit3: ['Edit3', 'SquarePen', 'Pencil', 'Edit2', 'PenLine'],
    MapPinned: ['MapPinned', 'MapPin', 'Map'],
    Infinity: ['Infinity', 'Sparkles', 'Flame'],
  };
  let node = lib && lib[name];
  if ((!node || !Array.isArray(node)) && lib && ALIAS[name]) {
    for (const k of ALIAS[name]) { if (lib[k] && Array.isArray(lib[k])) { node = lib[k]; break; } }
  }
  if (!node || !Array.isArray(node)) {
    return <span className={className} style={{ display: 'inline-block', width: size, height: size, ...style }} />;
  }
  const children = node[0] === 'svg' ? node[2] || [] : node;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill}
      stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={`shrink-0 ${className}`} style={style} aria-hidden="true">
      {children.map((c, i) => {
        const [tag, attrs] = c;
        const { key, ...rest } = attrs || {};
        return React.createElement(tag, { ...rest, key: i });
      })}
    </svg>
  );
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = (n) => String(n).padStart(2, '0');
const fmtShort = (ts) => { const d = new Date(ts); return `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`; };
const fmtTime = (ts) => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fmtDateFull = (ts) => { const d = new Date(ts); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]}) ${fmtTime(ts)}`; };
const fmtWon = (n) => `${Number(n).toLocaleString('ko-KR')}원`;

const vibrate = (ms = 12) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}


// 생년월일(YYYY-MM-DD) 기준 현재 만 나이 계산 유틸 함수
function calcAge(birthDate, fallbackAge = 27) {
  if (!birthDate || typeof birthDate !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(birthDate.trim())) {
    return typeof fallbackAge === 'number' && !isNaN(fallbackAge) ? fallbackAge : 27;
  }
  const [y, m, d] = birthDate.trim().split('-').map(Number);
  const now = new Date();
  let age = now.getFullYear() - y;
  const mDiff = (now.getMonth() + 1) - m;
  if (mDiff < 0 || (mDiff === 0 && now.getDate() < d)) age -= 1;
  return clamp(age, 0, 120);
}

/* =====================================================================
 * 3. CORE ALGORITHM ENGINE  (ABEi + TrueSkill-style dynamic rating)
 * ===================================================================== */
// [1] ABEi = PTS + 1.5*REB + 2.0*AST + 2.0*STL + 2.0*BLK - 2.0*TOV - 1.0*PF
const calcABEi = (s) => s.pts + 1.5 * s.reb + 2.0 * s.ast + 2.0 * s.stl + 2.0 * s.blk - 2.0 * s.tov - 1.0 * s.pf;

// [2] weight = 개인 ABEi / 팀 평균 ABEi  (0.5 ~ 1.5 클리핑)
function calcWeight(abei, teamAvg) {
  if (teamAvg > 0) return clamp(abei / teamAvg, 0.5, 1.5);
  // 팀 평균이 0 이하인 극단 케이스(전원 부진) → 평균 대비 차이 기반 보정
  return clamp(1 + (abei - teamAvg) / 10, 0.5, 1.5);
}

// [3] 레이팅 변동: 승리 = +25 × weight / 패배 = -20 ÷ weight / 무승부 = (weight-1)×10
const BASE_WIN = 25, BASE_LOSS = 20;
function calcDelta(result, weight) {
  if (result === 'W') return Math.round(BASE_WIN * weight);
  if (result === 'L') return -Math.round(BASE_LOSS / weight);
  return Math.round((weight - 1) * 10);
}

// 레이더 차트 6축 (0~100 정규화)
const RADAR_AXES = ['득점력', '패스', '리바운드', '수비력', '안정성', '효율(ABEi)'];
function radarScores(t) {
  if (!t || !t.gp) return [0, 0, 0, 0, 0, 0];
  const a = (k) => t[k] / t.gp;
  return [
    clamp((a('pts') / 20) * 100, 0, 100),
    clamp((a('ast') / 6) * 100, 0, 100),
    clamp((a('reb') / 10) * 100, 0, 100),
    clamp(((a('stl') + a('blk')) / 4) * 100, 0, 100),
    clamp(100 - ((a('tov') + a('pf')) / 8) * 100, 0, 100),
    clamp((t.abei / t.gp / 30) * 100, 0, 100),
  ].map((v) => Math.round(v));
}

// [4] 동적 칭호 부여
function computeBadges(t) {
  if (!t || !t.gp) return [];
  const a = (k) => t[k] / t.gp;
  const b = [];
  if (a('ast') >= 4) b.push('commander');
  if (a('stl') >= 2) b.push('thief');
  if (a('reb') >= 7) b.push('rebounder');
  if (a('blk') >= 1.5) b.push('rim');
  if (a('pts') >= 15) b.push('scorer');
  if (a('pf') >= 3.5) b.push('fighter');
  const r = radarScores(t);
  if (r.slice(0, 5).every((v) => v >= 50)) b.unshift('allround');
  return b;
}

// 경기 종료 → 전체 파이프라인 실행
function runEngine(state, matchId) {
  const m = state.matches.find((x) => x.id === matchId);
  if (!m || !m.live) return state;
  const { teams, stats } = m.live;
  const teamScore = (t) => teams[t].reduce((s, id) => s + stats[id].pts, 0);
  const scoreA = teamScore('A'), scoreB = teamScore('B');
  const winner = scoreA > scoreB ? 'A' : scoreB > scoreA ? 'B' : 'D';
  const users = { ...state.users };
  const rows = [];
  const teamAvgs = {};

  ['A', 'B'].forEach((t) => {
    const ids = teams[t];
    const abeis = ids.map((id) => calcABEi(stats[id]));
    // 유동 인원 대응: 실제 출전 팀 인원수(team_players.length)로 나눔
    const teamAvg = ids.length ? abeis.reduce((a, b) => a + b, 0) / ids.length : 0;
    teamAvgs[t] = teamAvg;
    ids.forEach((id, i) => {
      const u = users[id];
      if (!u) return;
      const abei = abeis[i];
      const weight = calcWeight(abei, teamAvg);
      const result = winner === 'D' ? 'D' : winner === t ? 'W' : 'L';
      const delta = calcDelta(result, weight);
      const before = u.rating;
      const after = Math.max(0, before + delta);
      const totals = { ...emptyTotals(), ...u.totals };
      totals.gp += 1;
      if (result === 'W') totals.wins += 1; else if (result === 'L') totals.losses += 1; else totals.draws += 1;
      STAT_KEYS.forEach((k) => (totals[k] += stats[id][k]));
      totals.abei += abei;
      const game = {
        matchId, title: m.title, court: m.court, date: m.datetime, team: t, result,
        stats: { ...stats[id] }, abei, teamAvg, weight, delta, before, after,
        score: { A: scoreA, B: scoreB }, teamSize: ids.length,
      };
      users[id] = {
        ...u,
        rating: after,
        lastDelta: delta,
        sigma: Math.max(1.5, +(u.sigma * 0.92).toFixed(2)),
        totals,
        badges: computeBadges(totals),
        history: [...u.history, { label: fmtShort(m.datetime), rating: after, delta, matchId }],
        games: [game, ...(u.games || [])].slice(0, 40), updatedAt: Date.now(),
      };
      rows.push({ id, nickname: u.nickname, position: u.position, ...game, tierBefore: getTier(before).id, tierAfter: getTier(after).id });
    });
  });

  const result = { scoreA, scoreB, winner, rows, teamAvgs, submittedAt: Date.now() };
  const inMatch = teams.A.includes(state.meId) || teams.B.includes(state.meId);
  return {
    ...state,
    users,
    matches: state.matches.map((x) => (x.id === matchId ? { ...x, status: 'finished', result, updatedAt: Date.now() } : x)),
    reveal: { matchId, at: Date.now() },
  };
}

/* =====================================================================
 * 4. SEED DATA
 * ===================================================================== */
function createSeed() {
  const rnd = mulberry32(20261016);
  const R = (a, b) => a + rnd() * (b - a);
  const RI = (a, b) => Math.round(R(a, b));
  const now = Date.now();
  const names = ['덩크왕민수', '세종조던', '골밑청소부', '야간슈터', '픽앤롤장인', '3점난사범', '코트의여우', '블록장인',
    '허슬플레이어', '미드레인지킹', '패스마스터', '풀코트프레스', '캐치앤슛', '포스트업장인', '스텝백요정', '리바운드머신', '앤드원헌터', '노룩패스'];
  const prof = {
    G: { pts: 12, reb: 3, ast: 5, stl: 1.9, blk: 0.3, tov: 2.2, pf: 2.1 },
    F: { pts: 13, reb: 6, ast: 2.6, stl: 1.2, blk: 0.8, tov: 1.8, pf: 2.6 },
    C: { pts: 10, reb: 8.5, ast: 1.5, stl: 0.6, blk: 1.8, tov: 1.6, pf: 3.2 },
  };
  const cities = Object.keys(REGIONS);
  const users = {};
  names.forEach((name, i) => {
    const pos = ['G', 'F', 'C'][i % 3];
    const id = `bot_${i + 1}`;
    const gp = RI(4, 14);
    const totals = emptyTotals();
    totals.gp = gp;
    totals.wins = RI(Math.floor(gp * 0.3), Math.ceil(gp * 0.7));
    totals.losses = gp - totals.wins;
    STAT_KEYS.forEach((k) => (totals[k] = Math.round(prof[pos][k] * R(0.55, 1.45) * gp)));
    totals.abei = calcABEi(totals);
    const rating = RI(985, 1430);
    const histLen = Math.min(gp, 9);
    const deltas = Array.from({ length: histLen }, () => RI(-22, 36));
    let r = rating - deltas.reduce((a, b) => a + b, 0);
    const history = [{ label: '시작', rating: r, delta: 0 }];
    deltas.forEach((d, j) => { r += d; history.push({ label: fmtShort(now - (histLen - j) * 3 * DAY), rating: r, delta: d }); });
    const city = i % 2 === 0 ? '세종특별자치시' : cities[RI(0, cities.length - 1)];
    const bYear = RI(1989, 2004);
    const birthDate = `${bYear}-${pad2(RI(1, 12))}-${pad2(RI(1, 28))}`;
    const gender = i % 5 === 0 ? 'F' : 'M';
    users[id] = {
      id, nickname: name, position: pos, isBot: true, gender, birthDate, age: calcAge(birthDate),
      height: pos === 'C' ? RI(186, 199) : pos === 'F' ? RI(180, 191) : RI(169, 183),
      weight: pos === 'C' ? RI(85, 102) : pos === 'F' ? RI(74, 88) : RI(63, 78),
      city, district: REGIONS[city][RI(0, REGIONS[city].length - 1)],
      rating, sigma: +Math.max(1.5, 8.33 * Math.pow(0.92, gp)).toFixed(2),
      totals, history, lastDelta: deltas[histLen - 1] || 0, badges: computeBadges(totals), games: [],
    };
  });
  const at = (dayOffset, h, m) => { const d = new Date(now + dayOffset * DAY); d.setHours(h, m, 0, 0); return d.getTime(); };
  const bots = Object.keys(users);
  const pick = (start, count) => bots.slice(start, start + count);
  const matches = [
    { id: 'm_1', title: '[세종] 금요 나이트 풀코트 매치', datetime: at(0, 20, 0), court: '고려대 세종캠퍼스 체육관', address: '세종특별자치시 조치원읍 세종로 2511', region: '세종특별자치시', isUnlimited: false,
      format: '5vs5 풀코트', maxPlayers: 12, recTier: '루키 ~ 아마추어', manager: '김가비 매니저', fee: 10000, participants: pick(0, 9), status: 'open', createdAt: now },
    { id: 'm_2', title: '[대전] 유성 주말 밸런스 매치', datetime: at(1, 19, 0), court: '대전 유성구 국민체육센터', address: '대전광역시 유성구 유성대로 807번길 19', region: '대전광역시', isUnlimited: false,
      format: '5vs5 풀코트', maxPlayers: 12, recTier: '전체 티어', manager: '박타임 매니저', fee: 12000, participants: pick(6, 10), status: 'open', createdAt: now },
    { id: 'm_3', title: '[서울] 성수 3vs3 하프코트 스트릿', datetime: at(1, 21, 30), court: '서울 성수 언더스탠드에비뉴 코트', address: '서울특별시 성동구 왕십리로 63', region: '서울특별시', isUnlimited: false,
      format: '3vs3 하프코트', maxPlayers: 8, recTier: '비기너 ~ 아마추어', manager: '이농구 매니저', fee: 8000, participants: pick(10, 3), status: 'open', createdAt: now },
    { id: 'm_4', title: '[세종] 일요 모닝 오픈런 무제한 매치', datetime: at(3, 9, 30), court: '세종 보람동 실내체육관', address: '세종특별자치시 보람서로 55', region: '세종특별자치시',
      format: '5vs5 풀코트', maxPlayers: 0, isUnlimited: true, recTier: '전체 티어', manager: '김가비 매니저', fee: 10000, participants: pick(3, 7), status: 'open', createdAt: now },
  ];
  return { version: 2, auth: null, meId: null, users, matches, customCourts: loadCustomCourts(), deletedMatchIds: loadDeletedMatchIds(), reveal: null, seenMatchId: null };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.version === 2 && s.users && s.matches) {
        return normalizeAndMergeState(s, null);
      }
    }
  } catch (e) {}
  return createSeed();
}


// 탭/브라우저/서버 간 상태 병합 유틸 (매니저 개설 매치 및 멀티유저 참가자 유실 원천 방지)
function normalizeAndMergeState(base, incoming) {
  const b = (base && base.version === 2 && base.users && base.matches) ? base : null;
  const inc = (incoming && incoming.version === 2 && incoming.users && incoming.matches) ? incoming : null;
  if (!b && !inc) {
    const seed = createSeed();
    const mySess = loadMySession();
    return { ...seed, auth: mySess.auth || null, meId: mySess.auth ? (mySess.meId || null) : null };
  }
  const primary = inc || b;
  const secondary = inc ? b : null;

  // 1) 삭제된 매치 ID 병합
  const deletedSet = new Set([
    ...loadDeletedMatchIds(),
    ...((b && b.deletedMatchIds) || []),
    ...((inc && inc.deletedMatchIds) || []),
  ]);

  // 2) 커스텀 체육관 병합
  const courtMap = new Map();
  [...loadCustomCourts(), ...((b && b.customCourts) || []), ...((inc && inc.customCourts) || [])].forEach((c) => {
    if (c && c.name) courtMap.set(c.name, c);
  });
  const customCourts = Array.from(courtMap.values());

  // 3) 매치 병합 (primary + secondary + gt_manager_matches_v2 전용 스토리지 + 멀티유저 참가자 CRDT 합집합 병합)
  const mergeMatchObj = (prev, next) => {
    const tPrev = prev.updatedAt || prev.createdAt || 0;
    const tNext = next.updatedAt || next.createdAt || 0;
    const newer = tNext >= tPrev ? next : prev;
    const older = tNext >= tPrev ? prev : next;

    const appliedAt = { ...((older && older.appliedAt) || {}), ...((newer && newer.appliedAt) || {}) };
    if (older && older.appliedAt && newer && newer.appliedAt) {
      Object.keys(older.appliedAt).forEach((k) => {
        appliedAt[k] = Math.max(older.appliedAt[k] || 0, newer.appliedAt[k] || 0);
      });
    }
    const cancelledAt = { ...((older && older.cancelledAt) || {}), ...((newer && newer.cancelledAt) || {}) };
    if (older && older.cancelledAt && newer && newer.cancelledAt) {
      Object.keys(older.cancelledAt).forEach((k) => {
        cancelledAt[k] = Math.max(older.cancelledAt[k] || 0, newer.cancelledAt[k] || 0);
      });
    }

    const cancelledSet = new Set([...(older.cancelledIds || []), ...(newer.cancelledIds || [])]);
    const removedSet = new Set([...(older.removedIds || []), ...(newer.removedIds || [])]);

    [older.lastOp, newer.lastOp].forEach((op) => {
      if (!op || !op.uid) return;
      const uid = op.uid;
      const ts = op.at || 0;
      if (op.type === 'APPLY' && ts >= (cancelledAt[uid] || 0)) {
        appliedAt[uid] = Math.max(appliedAt[uid] || 0, ts);
        cancelledSet.delete(uid);
        removedSet.delete(uid);
      } else if (op.type === 'CANCEL' && ts >= (appliedAt[uid] || 0)) {
        cancelledAt[uid] = Math.max(cancelledAt[uid] || 0, ts);
        cancelledSet.add(uid);
      } else if (op.type === 'ADMIN_REMOVE_PARTICIPANT' && ts >= (appliedAt[uid] || 0)) {
        cancelledAt[uid] = Math.max(cancelledAt[uid] || 0, ts);
        removedSet.add(uid);
      }
    });

    Object.keys(appliedAt).forEach((uid) => {
      if ((appliedAt[uid] || 0) > (cancelledAt[uid] || 0)) {
        cancelledSet.delete(uid);
        removedSet.delete(uid);
      }
    });
    Object.keys(cancelledAt).forEach((uid) => {
      if ((cancelledAt[uid] || 0) > (appliedAt[uid] || 0)) {
        cancelledSet.add(uid);
      }
    });

    const pList = [];
    const candidates = [
      ...(older.participants || []),
      ...(newer.participants || []),
      ...Object.keys(appliedAt).filter((uid) => (appliedAt[uid] || 0) > (cancelledAt[uid] || 0)),
    ];
    candidates.forEach((pid) => {
      if (!pid || pList.includes(pid)) return;
      if (!cancelledSet.has(pid) && !removedSet.has(pid)) {
        pList.push(pid);
      }
    });
    return {
      ...older,
      ...newer,
      participants: pList,
      cancelledIds: Array.from(cancelledSet),
      removedIds: Array.from(removedSet),
      appliedAt,
      cancelledAt,
    };
  };
  const byId = new Map();
  const order = [];
  const pushCandidate = (m) => {
    if (!m || !m.id || deletedSet.has(m.id)) return;
    if (!byId.has(m.id)) {
      order.push(m.id);
      byId.set(m.id, m);
    } else {
      byId.set(m.id, mergeMatchObj(byId.get(m.id), m));
    }
  };
  loadManagerMatches().forEach(pushCandidate);
  if (secondary && Array.isArray(secondary.matches)) secondary.matches.forEach(pushCandidate);
  if (primary && Array.isArray(primary.matches)) primary.matches.forEach(pushCandidate);

  const allMatches = order.map((id) => {
    const m = byId.get(id);
    const mgr = isManagerMatch(m);
    return {
      ...m,
      isManagerCreated: mgr,
      isUnlimited: isUnlimitedMatch(m),
      address: getCourtAddress(m, { customCourts }),
    };
  });
  // 매니저가 개설한 매치가 항상 배열 최상단에 위치하도록 정렬
  const mgrList = allMatches.filter((m) => m.isManagerCreated).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
  const seedList = allMatches.filter((m) => !m.isManagerCreated);
  const matches = [...mgrList, ...seedList];

  // 4) 유저 병합 (모든 기기의 가입 유저·포지션 수정·경기 기록 보존)
  const rawUsers = { ...((secondary && secondary.users) || {}), ...((primary && primary.users) || {}) };
  if (secondary && secondary.users && primary && primary.users) {
    Object.keys(secondary.users).forEach((uid) => {
      if (primary.users[uid]) {
        const u1 = secondary.users[uid];
        const u2 = primary.users[uid];
        const gp1 = (u1.totals && u1.totals.gp) || 0;
        const gp2 = (u2.totals && u2.totals.gp) || 0;
        const t1 = u1.updatedAt || u1.joinedAt || 0;
        const t2 = u2.updatedAt || u2.joinedAt || 0;
        if (gp1 !== gp2) {
          rawUsers[uid] = gp1 > gp2 ? { ...u2, ...u1 } : { ...u1, ...u2 };
        } else {
          rawUsers[uid] = t1 > t2 ? { ...u2, ...u1 } : { ...u1, ...u2 };
        }
      }
    });
  }
  const users = Object.fromEntries(Object.entries(rawUsers).map(([k, u]) => {
    const birthDate = u.birthDate || `${new Date().getFullYear() - (u.age || 27)}-05-15`;
    return [k, { ...u, birthDate, age: calcAge(birthDate, u.age), gender: u.gender || 'M' }];
  }));

  // 5) 기기별 전용 세션 키(SESSION_KEY = 'gt_my_session_v2')에서만 auth / meId 로드
  // SESSION_KEY가 비어있으면 폴링이나 병합 시 절대 auth나 meId를 되살리지 않음
  const mySession = loadMySession();
  const auth = mySession.auth || null;
  const meId = auth ? (mySession.meId || null) : null;

  return {
    ...secondary,
    ...primary,
    version: 2,
    auth,
    meId,
    users,
    matches,
    customCourts,
    deletedMatchIds: Array.from(deletedSet),
  };
}

function readRawStorageState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return (s && s.version === 2) ? s : null;
  } catch (e) { return null; }
}

function stateFingerprint(s) {
  if (!s) return '';
  const mKey = (s.matches || []).map((m) => `${m.id}:${m.status}:${(m.participants || []).join(',')}:${m.updatedAt || m.createdAt || 0}:${m.live ? m.live.undo.length : 0}`).join('|');
  const cKey = (s.customCourts || []).map((c) => c.name).join(',');
  const uAllKey = Object.values(s.users || {}).map((u) => `${u.id}:${u.nickname}:${u.position}:${u.rating}:${u.updatedAt || 0}`).sort().join('|');
  return `${Boolean(s.auth)}#${s.meId || ''}#${mKey}#${cKey}#${uAllKey}#${s.reveal ? s.reveal.matchId : ''}`;
}
/* =====================================================================
 * 5. GLOBAL STATE (Reducer + LocalStorage)
 * ===================================================================== */
const mapMatch = (state, id, fn) => ({ ...state, matches: state.matches.map((m) => (m.id === id ? { ...fn(m), updatedAt: Date.now() } : m)) });

function coreReducer(state, a) {
  switch (a.type) {
    case 'LOGIN': {
      const authObj = { provider: a.provider, email: a.email || '', at: Date.now() };
      let nextMeId = null;
      if (a.uid && state.users && state.users[a.uid] && !state.users[a.uid].isBot) {
        nextMeId = a.uid;
      } else if (a.provider === 'email' && a.email) {
        const targetEmail = a.email.trim().toLowerCase();
        const existing = Object.values(state.users || {}).find(
          (u) => u && !u.isBot && ((u.email && u.email.trim().toLowerCase() === targetEmail) || (u.nickname && `${u.nickname}@garbagetime.kr`.toLowerCase() === targetEmail))
        );
        if (existing) nextMeId = existing.id;
      } else if (a.provider === 'kakao' && !a.forceNew) {
        try {
          const lastUid = localStorage.getItem(LAST_KAKAO_UID_KEY);
          if (a.reconnect && lastUid && state.users && state.users[lastUid] && !state.users[lastUid].isBot) {
            nextMeId = lastUid;
          }
        } catch (e) {}
      }
      saveMySession(authObj, nextMeId);
      return { ...state, auth: authObj, meId: nextMeId };
    }
    case 'LOGOUT': {
      saveMySession(null, null);
      return { ...state, auth: null, meId: null };
    }
    case 'ONBOARD': {
      const id = genUserId();
      const nowTs = Date.now();
      const email = (state.auth && state.auth.email) || a.profile.email || '';
      const provider = (state.auth && state.auth.provider) || 'kakao';
      const authObj = state.auth || { provider, email, at: nowTs };
      const u = {
        id, ...a.profile, email, provider, isBot: false, rating: 1000, sigma: 8.33, totals: emptyTotals(),
        history: [{ label: '가입', rating: 1000, delta: 0 }], lastDelta: 0, badges: [], games: [],
        joinedAt: nowTs, updatedAt: nowTs,
      };
      saveMySession(authObj, id);
      try { localStorage.setItem(LAST_KAKAO_UID_KEY, id); } catch (e) {}
      return { ...state, auth: authObj, meId: id, users: { ...state.users, [id]: u } };
    }
    case 'APPLY': {
      if (!state.meId) return state;
      const nowTs = Date.now();
      const meUser = state.users && state.users[state.meId]
        ? { ...state.users[state.meId], updatedAt: nowTs }
        : null;
      const nextUsers = meUser ? { ...state.users, [state.meId]: meUser } : state.users;
      return mapMatch({ ...state, users: nextUsers }, a.matchId, (m) =>
        m.status === 'open' && (isUnlimitedMatch(m) || m.participants.length < m.maxPlayers) && !m.participants.includes(state.meId)
          ? {
              ...m,
              participants: [...m.participants, state.meId],
              cancelledIds: (m.cancelledIds || []).filter((x) => x !== state.meId),
              removedIds: (m.removedIds || []).filter((x) => x !== state.meId),
              appliedAt: { ...((m && m.appliedAt) || {}), [state.meId]: nowTs },
              lastOp: { type: 'APPLY', uid: state.meId, at: nowTs },
            }
          : m
      );
    }
    case 'CANCEL': {
      if (!state.meId) return state;
      const nowTs = Date.now();
      return mapMatch(state, a.matchId, (m) =>
        m.status === 'open'
          ? {
              ...m,
              participants: m.participants.filter((x) => x !== state.meId),
              cancelledIds: Array.from(new Set([...(m.cancelledIds || []), state.meId])),
              cancelledAt: { ...((m && m.cancelledAt) || {}), [state.meId]: nowTs },
              lastOp: { type: 'CANCEL', uid: state.meId, at: nowTs },
            }
          : m
      );
    }
    case 'CREATE_MATCH': {
      let customCourts = Array.isArray(state.customCourts) ? state.customCourts : loadCustomCourts();
      if (a.newCourt && a.newCourt.name) {
        const exists = customCourts.some((c) => c.name === a.newCourt.name) || COURTS.some((c) => c.name === a.newCourt.name);
        customCourts = exists
          ? customCourts.map((c) => (c.name === a.newCourt.name ? { ...c, ...a.newCourt } : c))
          : [...customCourts, { ...a.newCourt, isCustom: true, createdAt: Date.now() }];
        try { localStorage.setItem(CUSTOM_COURTS_KEY, JSON.stringify(customCourts)); } catch (e) {}
      }
      const newMatch = {
        ...a.match,
        isManagerCreated: true,
        createdAt: a.match.createdAt || Date.now(),
        updatedAt: Date.now(),
      };
      const nextMatches = [newMatch, ...state.matches.filter((m) => m.id !== newMatch.id)];
      saveManagerMatches(nextMatches);
      return { ...state, customCourts, matches: nextMatches };
    }
    case 'ADD_CUSTOM_COURT': {
      if (!a.court || !a.court.name) return state;
      const prev = Array.isArray(state.customCourts) ? state.customCourts : loadCustomCourts();
      const exists = prev.some((c) => c.name === a.court.name) || COURTS.some((c) => c.name === a.court.name);
      const customCourts = exists
        ? prev.map((c) => (c.name === a.court.name ? { ...c, ...a.court } : c))
        : [...prev, { ...a.court, isCustom: true, createdAt: Date.now() }];
      try { localStorage.setItem(CUSTOM_COURTS_KEY, JSON.stringify(customCourts)); } catch (e) {}
      return { ...state, customCourts };
    }
    case 'UPDATE_PROFILE': {
      const id = state.meId;
      if (!id || !state.users[id]) return state;
      const prev = state.users[id];
      const birthDate = a.profile.birthDate || prev.birthDate || '1999-05-15';
      const updated = {
        ...prev,
        ...a.profile,
        birthDate,
        age: calcAge(birthDate, a.profile.age ?? prev.age),
        updatedAt: Date.now(),
      };
      return { ...state, users: { ...state.users, [id]: updated } };
    }
    case 'ADMIN_SET_USER_POS': {
      const uid = a.uid;
      const pos = a.position;
      if (!uid || !pos || !POSITIONS[pos] || !state.users || !state.users[uid]) return state;
      const updatedUser = {
        ...state.users[uid],
        position: pos,
        updatedAt: Date.now(),
      };
      return { ...state, users: { ...state.users, [uid]: updatedUser } };
    }
    case 'ADMIN_REMOVE_PARTICIPANT': {
      const { matchId, uid } = a;
      if (!matchId || !uid) return state;
      const nowTs = Date.now();
      return mapMatch(state, matchId, (m) => ({
        ...m,
        participants: (m.participants || []).filter((x) => x !== uid),
        removedIds: Array.from(new Set([...(m.removedIds || []), uid])),
        cancelledAt: { ...((m && m.cancelledAt) || {}), [uid]: nowTs },
        lastOp: { type: 'ADMIN_REMOVE_PARTICIPANT', uid, at: nowTs },
      }));
    }
    case 'DELETE_MATCH': {
      const deletedMatchIds = Array.from(new Set([...(state.deletedMatchIds || []), ...loadDeletedMatchIds(), a.matchId]));
      saveDeletedMatchIds(deletedMatchIds);
      const nextMatches = state.matches.filter((m) => m.id !== a.matchId);
      saveManagerMatches(nextMatches);
      return { ...state, deletedMatchIds, matches: nextMatches };
    }
    case 'FILL_BOTS':
      return mapMatch(state, a.matchId, (m) => {
        const pool = Object.values(state.users).filter((u) => u.isBot && !m.participants.includes(u.id)).map((u) => u.id);
        pool.sort(() => Math.random() - 0.5);
        const cap = isUnlimitedMatch(m) ? Math.max(12, m.participants.length + 6) : Math.max(m.maxPlayers || 10, a.upTo || 0);
        const target = a.upTo ? a.upTo : cap;
        const need = Math.max(0, target - m.participants.length);
        const added = pool.slice(0, need);
        const nowTs = Date.now();
        const nextAppliedAt = { ...((m && m.appliedAt) || {}) };
        added.forEach((id) => { nextAppliedAt[id] = nowTs; });
        return {
          ...m,
          participants: [...m.participants, ...added],
          cancelledIds: (m.cancelledIds || []).filter((x) => !added.includes(x)),
          removedIds: (m.removedIds || []).filter((x) => !added.includes(x)),
          appliedAt: nextAppliedAt,
        };
      });
    case 'START_GAME':
      return mapMatch(state, a.matchId, (m) => {
        const allTeamIds = Array.from(new Set([...(m.participants || []), ...(a.teams.A || []), ...(a.teams.B || [])]));
        const nowTs = Date.now();
        const nextAppliedAt = { ...((m && m.appliedAt) || {}) };
        allTeamIds.forEach((id) => { nextAppliedAt[id] = Math.max(nextAppliedAt[id] || 0, nowTs); });
        return {
          ...m,
          participants: allTeamIds,
          appliedAt: nextAppliedAt,
          status: 'live',
          live: {
            teams: a.teams, onCourt: a.starters,
            stats: Object.fromEntries([...a.teams.A, ...a.teams.B].map((id) => [id, emptyStats()])),
            undo: [], startedAt: nowTs,
          },
        };
      });
    case 'STAT':
      return mapMatch(state, a.matchId, (m) => {
        if (!m.live) return m;
        const s = { ...m.live.stats[a.uid] };
        s[a.key] += a.amount;
        return { ...m, live: { ...m.live, stats: { ...m.live.stats, [a.uid]: s }, undo: [...m.live.undo, { uid: a.uid, key: a.key, amount: a.amount, t: Date.now() }].slice(-300) } };
      });
    case 'UNDO':
      return mapMatch(state, a.matchId, (m) => {
        if (!m.live || !m.live.undo.length) return m;
        const undo = [...m.live.undo];
        const last = undo.pop();
        const s = { ...m.live.stats[last.uid] };
        s[last.key] = Math.max(0, s[last.key] - last.amount);
        return { ...m, live: { ...m.live, undo, stats: { ...m.live.stats, [last.uid]: s } } };
      });
    case 'SUB':
      return mapMatch(state, a.matchId, (m) => {
        if (!m.live) return m;
        const court = m.live.onCourt[a.team].map((id) => (id === a.outId ? a.inId : id));
        return { ...m, live: { ...m.live, onCourt: { ...m.live.onCourt, [a.team]: court } } };
      });
    case 'SUBMIT':
      return runEngine(state, a.matchId);
    case 'CLEAR_REVEAL':
      return { ...state, reveal: null };
    case 'SEEN':
      return state.seenMatchId === a.matchId ? state : { ...state, seenMatchId: a.matchId };
    case 'SET_STATUS':
      // 매니저 상태 제어: 신청 마감(closed) / 모집 재개(open) / 경기 취소·중단(cancelled)
      return mapMatch(state, a.matchId, (m) => {
        if (m.status === 'finished') return m;
        if (a.status === 'cancelled') { const { live, ...rest } = m; return { ...rest, status: 'cancelled', cancelledAt: Date.now() }; }
        if (m.status === 'live' || m.status === 'cancelled') return m;
        return { ...m, status: a.status };
      });
    case 'HYDRATE':
      // 다른 탭/창(admin.html ↔ index.html)에서 변경된 상태를 병합 반영
      return normalizeAndMergeState(state, a.state);
    case 'RESET':
      return createSeed();
    default:
      return state;
  }
}

const Store = createContext(null);
const useStore = () => useContext(Store);


// 동기식 영속화 & 멀티채널 브로드캐스트 래퍼 리듀서
let _bc = null;
try { if (typeof BroadcastChannel !== 'undefined') _bc = new BroadcastChannel('garbagetime_sync'); } catch (e) {}

function pushStateEverywhere(nextState, isReset = false) {
  try {
    saveManagerMatches(nextState.matches || []);
    saveDeletedMatchIds(nextState.deletedMatchIds || []);
    // 전역 공유 상태(STORAGE_KEY 및 /api/state)에는 기기별 세션(auth, meId)을 포함하지 않고 공유 데이터만 전송
    const sharedPayload = { ...nextState, auth: null, meId: null };
    const raw = JSON.stringify(sharedPayload);
    localStorage.setItem(STORAGE_KEY, raw);
    if (_bc) _bc.postMessage({ type: 'SYNC_STATE', state: sharedPayload });
    if (location.protocol.startsWith('http')) {
      fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(isReset ? { reset: true, state: sharedPayload } : { state: sharedPayload }),
      })
        .then((r) => (r && r.ok ? r.json() : null))
        .then((d) => {
          if (d && d.ok && d.state && d.state.version === 2) {
            const merged = normalizeAndMergeState(nextState, d.state);
            const mergedShared = { ...merged, auth: null, meId: null };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(mergedShared));
          }
        })
        .catch(() => {});
    }
  } catch (e) {}
}

function reducer(rawState, a) {
  if (a.type === 'RESET') {
    try {
      localStorage.removeItem(MANAGER_MATCHES_KEY);
      localStorage.removeItem(DELETED_MATCHES_KEY);
      localStorage.removeItem(CUSTOM_COURTS_KEY);
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(LAST_KAKAO_UID_KEY);
      localStorage.removeItem('gt_guide_seen');
    } catch (e) {}
    const fresh = createSeed();
    pushStateEverywhere(fresh, true);
    return fresh;
  }
  if (a.type === 'HYDRATE') {
    const merged = normalizeAndMergeState(rawState, a.state);
    saveManagerMatches(merged.matches || []);
    return merged;
  }
  if (a.type === 'LOGOUT') {
    saveMySession(null, null);
    const loggedOut = { ...rawState, auth: null, meId: null };
    pushStateEverywhere(loggedOut, false);
    return loggedOut;
  }
  // 액션 실행 직전 localStorage 최신 상태와 먼저 병합하여 다른 탭의 변경사항(신규 매치 등) 덮어쓰기 방지
  const latestBase = normalizeAndMergeState(rawState, readRawStorageState());
  const nextRaw = coreReducer(latestBase, a);
  const mergedNext = normalizeAndMergeState(latestBase, nextRaw);
  pushStateEverywhere(mergedNext, false);
  return mergedNext;
}

/* 공용 영속화 + 탭/창/서버 간 실시간 동기화 훅 (index.html ↔ admin.html & 멀티 스마트폰) */
function useSharedPersistence(state, dispatch, setTheme) {
  const stateRef = useRef(state);
  useEffect(() => {
    stateRef.current = state;
    try {
      saveManagerMatches(state.matches || []);
      const currentStored = readRawStorageState();
      const merged = normalizeAndMergeState(currentStored, state);
      const sharedOnly = { ...merged, auth: null, meId: null };
      const raw = JSON.stringify(sharedOnly);
      if (localStorage.getItem(STORAGE_KEY) !== raw) localStorage.setItem(STORAGE_KEY, raw);
    } catch (e) {}
  }, [state]);

  useEffect(() => {
    const applyIncoming = (incoming) => {
      if (!incoming || incoming.version !== 2) return;
      const merged = normalizeAndMergeState(stateRef.current, incoming);
      if (stateFingerprint(merged) !== stateFingerprint(stateRef.current)) {
        dispatch({ type: 'HYDRATE', state: merged });
      }
    };

    const syncFromLocalAndServer = () => {
      const localS = readRawStorageState();
      const mgrMatches = loadManagerMatches();
      if (localS) applyIncoming(localS);
      else if (mgrMatches.length > 0) applyIncoming({ ...stateRef.current, matches: [...mgrMatches, ...(stateRef.current.matches || [])] });

      if (location.protocol.startsWith('http')) {
        fetch('/api/state', { cache: 'no-store' })
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => {
            if (d && d.ok && d.state && d.state.version === 2) {
              // 클라우드 서버 동기화 시: 매치·유저·체육관 데이터는 실시간 공유하되,
              // 각 스마트폰/브라우저의 로그인 세션(auth, meId)은 SESSION_KEY 기준으로 독립 유지
              applyIncoming({ ...d.state, auth: null, meId: null });
            } else if (d && d.ok && !d.state && stateRef.current) {
              // 서버에 아직 초기 상태가 없으면 현재 상태를 서버에 업로드
              pushStateEverywhere(stateRef.current, false);
            }
          })
          .catch(() => {});
      }
    };

    // 마운트 직후 1회 즉시 동기화
    syncFromLocalAndServer();

    const onStorage = (e) => {
      if ((e.key === STORAGE_KEY || e.key === MANAGER_MATCHES_KEY || e.key === SESSION_KEY) && e.newValue !== undefined) {
        syncFromLocalAndServer();
      }
      if (e.key === 'gt_theme' && setTheme && (e.newValue === 'light' || e.newValue === 'dark')) {
        setTheme(e.newValue);
      }
    };

    const onBc = (e) => {
      if (e && e.data && e.data.type === 'SYNC_STATE' && e.data.state) {
        applyIncoming(e.data.state);
      }
    };

    const onFocusOrVisible = () => {
      if (document.visibilityState === 'visible') syncFromLocalAndServer();
    };

    window.addEventListener('storage', onStorage);
    window.addEventListener('focus', syncFromLocalAndServer);
    window.addEventListener('pageshow', syncFromLocalAndServer);
    document.addEventListener('visibilitychange', onFocusOrVisible);
    if (_bc) _bc.addEventListener('message', onBc);
    const timer = setInterval(syncFromLocalAndServer, 1000);

    return () => {
      window.removeEventListener('storage', onStorage);
      window.removeEventListener('focus', syncFromLocalAndServer);
      window.removeEventListener('pageshow', syncFromLocalAndServer);
      document.removeEventListener('visibilitychange', onFocusOrVisible);
      if (_bc) _bc.removeEventListener('message', onBc);
      clearInterval(timer);
    };
  }, [setTheme]);
}

function matchStatus(m) {
  if (m.status === 'live') return { key: 'live', label: '● LIVE 경기중', cls: 'bg-red-500/15 text-red-400 border-red-500/40' };
  if (m.status === 'finished') return { key: 'done', label: '경기 종료', cls: 'bg-white/5 text-white/50 border-white/10' };
  if (m.status === 'cancelled') return { key: 'cancelled', label: '경기 취소', cls: 'bg-red-500/10 text-red-400 border-red-500/30' };
  if (m.status === 'closed') return { key: 'closed', label: '신청 마감', cls: 'bg-white/5 text-white/60 border-white/15' };
  if (isUnlimitedMatch(m)) return { key: 'unlimited', label: '∞ 오픈런 모집중', cls: 'bg-neon/15 text-neon border-neon/40' };
  const left = m.maxPlayers - m.participants.length;
  if (left <= 0) return { key: 'full', label: '모집 마감', cls: 'bg-white/5 text-white/50 border-white/10' };
  if (left <= 2) return { key: 'hot', label: '🔥 마감 임박', cls: 'bg-brand/15 text-brand border-brand/40' };
  return { key: 'open', label: '모집중', cls: 'bg-neon/10 text-neon border-neon/30' };
}

// 테마별 차트 색상 (라이트 모드에서는 다크 차콜 기반으로 전환)
function chartTheme() {
  const light = document.documentElement.classList.contains('light');
  const rgb = light ? '17,24,39' : '255,255,255';
  return { fg: (a) => `rgba(${rgb},${a})`, bg: light ? '#FFFFFF' : '#121212', border: light ? '#E5E7EB' : '#333' };
}

function RadarChart({ values, compare, height = 290 }) {
  const ref = useRef(null);
  const chart = useRef(null);
  const theme = (useStore() || {}).theme;
  useEffect(() => {
    if (!window.Chart || !ref.current) return;
    const ct = chartTheme();
    chart.current && chart.current.destroy();
    chart.current = new Chart(ref.current.getContext('2d'), {
      type: 'radar',
      data: {
        labels: RADAR_AXES,
        datasets: [
          { label: '나의 플레이 스타일', data: values, backgroundColor: 'rgba(255,85,0,0.28)', borderColor: '#FF5500', borderWidth: 2.5,
            pointBackgroundColor: '#00FF66', pointBorderColor: ct.bg, pointBorderWidth: 2, pointRadius: 4.5, pointHoverRadius: 6 },
          ...(compare ? [{ label: '플랫폼 평균', data: compare, backgroundColor: ct.fg(0.03), borderColor: ct.fg(0.35),
            borderDash: [4, 4], borderWidth: 1.2, pointRadius: 0 }] : []),
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 1000, easing: 'easeOutQuart' },
        scales: {
          r: {
            min: 0, max: 100, ticks: { display: false, stepSize: 25 },
            grid: { color: ct.fg(0.08) }, angleLines: { color: ct.fg(0.1) },
            pointLabels: { color: ct.fg(0.85), font: { size: 12, weight: '700', family: 'Pretendard Variable' } },
          },
        },
        plugins: {
          legend: { display: !!compare, position: 'bottom', labels: { color: ct.fg(.6), boxWidth: 10, boxHeight: 10, font: { size: 11 } } },
          tooltip: { backgroundColor: ct.bg, borderColor: ct.border, borderWidth: 1, callbacks: { label: (c) => ` ${c.dataset.label}: ${Math.round(c.raw)}점` } },
        },
      },
    });
    return () => chart.current && chart.current.destroy();
  }, [JSON.stringify(values), JSON.stringify(compare), theme]);
  return <div style={{ height }} className="relative"><canvas ref={ref} /></div>;
}

const tierLinesPlugin = {
  id: 'tierLines',
  beforeDatasetsDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.y) return;
    TIERS.slice(1).forEach((t) => {
      const py = scales.y.getPixelForValue(t.min);
      if (py < chartArea.top || py > chartArea.bottom) return;
      ctx.save();
      ctx.strokeStyle = `${t.color}55`;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(chartArea.left, py); ctx.lineTo(chartArea.right, py); ctx.stroke();
      ctx.fillStyle = t.color; ctx.font = '700 10px Pretendard Variable'; ctx.textAlign = 'right';
      ctx.fillText(`${t.name} ${t.min}`, chartArea.right - 4, py - 4);
      ctx.restore();
    });
  },
};

function MomentumChart({ history, height = 230 }) {
  const ref = useRef(null);
  const chart = useRef(null);
  const theme = (useStore() || {}).theme;
  const data = history.slice(-10);
  useEffect(() => {
    if (!window.Chart || !ref.current) return;
    const ct = chartTheme();
    chart.current && chart.current.destroy();
    const ctx = ref.current.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, 'rgba(255,85,0,0.35)');
    grad.addColorStop(1, 'rgba(255,85,0,0)');
    const ratings = data.map((d) => d.rating);
    const last = data.length - 1;
    chart.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map((d) => d.label),
        datasets: [{
          label: '레이팅', data: ratings, fill: true, backgroundColor: grad, borderColor: '#FF5500', borderWidth: 2.5, tension: 0.4,
          pointBackgroundColor: data.map((d, i) => (i === last ? '#00FF66' : d.delta > 0 ? '#00FF66' : d.delta < 0 ? '#EF4444' : '#888')),
          pointBorderColor: ct.bg, pointBorderWidth: 2,
          pointRadius: data.map((_, i) => (i === last ? 7 : 4)), pointHoverRadius: 8,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: { duration: 900, easing: 'easeOutQuart' },
        interaction: { intersect: false, mode: 'index' },
        scales: {
          x: { grid: { display: false }, ticks: { color: ct.fg(.45), font: { size: 10 } } },
          y: {
            suggestedMin: Math.min(...ratings) - 30, suggestedMax: Math.max(...ratings) + 30,
            grid: { color: ct.fg(.05) }, ticks: { color: ct.fg(.45), font: { size: 10 }, maxTicksLimit: 5 },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: ct.bg, borderColor: ct.border, borderWidth: 1, displayColors: false,
            callbacks: { label: (c) => { const d = data[c.dataIndex]; return [`레이팅 ${d.rating} PT`, d.delta ? `변동 ${signed(d.delta)} PT` : '기준점']; } },
          },
        },
      },
      plugins: [tierLinesPlugin],
    });
    return () => chart.current && chart.current.destroy();
  }, [JSON.stringify(data), theme]);
  return <div style={{ height }} className="relative"><canvas ref={ref} /></div>;
}

              <input value={pw} onChange={(e) => setPw(e.target.value)} type="password" placeholder="비밀번호 (4자 이상)"
                className="w-full rounded-xl border border-white/10 bg-ink px-4 py-3 text-sm outline-none focus:border-brand" />
              <Btn type="submit" className="w-full" disabled={!!loading}>
                {loading === 'email' ? <Icon name="LoaderCircle" size={16} className="spin-slow" /> : <Icon name="LogIn" size={16} />} 로그인 / 회원가입
              </Btn>
            </form>
          )}
          <p className="pt-2 text-center text-[11px] text-white/30">시작하면 서비스 이용약관 및 개인정보 처리방침에 동의하게 됩니다.</p>
        </div>
      </div>
    </div>
  );
}

function Onboarding() {
  const { state, dispatch, toast } = useStore();
  const [step, setStep] = useState(0);
  const [f, setF] = useState({
    realName: '', gender: 'M', birthDate: '1999-05-15',
    nickname: '', height: 178, weight: 72, city: '세종특별자치시', district: '조치원읍', position: '',
  });
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const steps = ['기본 정보', '닉네임', '신체 · 지역', '포지션'];
  const TOTAL = steps.length;
  const inputCls = 'w-full rounded-2xl border border-white/10 bg-panel px-5 py-4 text-lg font-bold outline-none transition focus:border-brand';
  const manAge = calcAge(f.birthDate, 27);

  const next = () => {
    if (step === 0) {
      if (!/^[가-힣]{2,5}$/.test(f.realName.trim())) return toast('이름은 한글 2~5자로 입력해주세요', 'error');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(f.birthDate)) return toast('생년월일(YYYY-MM-DD)을 선택해주세요', 'error');
      if (manAge < 10 || manAge > 85) return toast('유효한 생년월일을 입력해주세요 (만 10~85세)', 'error');
    }
    if (step === 1) {
      const n = f.nickname.trim();
      if (n.length < 2 || n.length > 10) return toast('닉네임은 2~10자로 입력해주세요', 'error');
      if (Object.values(state.users).some((u) => u.nickname === n)) return toast('이미 사용 중인 닉네임입니다', 'error');
    }
    if (step === 2 && (f.height < 140 || f.height > 230 || f.weight < 35 || f.weight > 160)) return toast('신체 정보를 확인해주세요', 'error');
    if (step === 3 && !f.position) return toast('주 포지션을 선택해주세요', 'error');
    vibrate(8);
    setStep(step + 1);
  };
  const finish = () => dispatch({
    type: 'ONBOARD',
    profile: { ...f, realName: f.realName.trim(), nickname: f.nickname.trim(), height: +f.height, weight: +f.weight, birthDate: f.birthDate, age: manAge },
  });

  if (step === TOTAL) {
    const info = [
      ['이름', f.realName], ['성별 · 나이', `${f.gender === 'F' ? '여성' : '남성'} · 만 ${manAge}세`], ['포지션', POSITIONS[f.position].name],
    ];
    const info2 = [['생년월일', f.birthDate], ['신체', `${f.height}cm · ${f.weight}kg`], ['활동 지역', `${f.city.replace(/(특별자치시|특별시|광역시)$/, '')} ${f.district}`]];
    return (
      <div className="court-bg flex min-h-[100dvh] items-center justify-center px-6">
        <div className="w-full text-center">
          <div className="pop-in mx-auto w-fit"><TierEmblem rating={1000} size={132} glow /></div>
          <div className="mt-5 text-xs font-bold tracking-[.3em] text-white/40">INITIAL PLACEMENT</div>
          <div className="mt-1 font-hans text-3xl">루키 티어 배정 완료!</div>
          <div className="mt-2 font-bebas text-5xl text-brand text-glow-orange">1000 PT</div>
          <p className="mt-3 text-sm text-white/55"><b className="text-white">{f.nickname}</b>({f.realName})님, 가비지타임에 오신 걸 환영해요.<br />공식 매치에서 기록을 쌓아 티어를 올려보세요!</p>
          <Card className="mt-6 grid grid-cols-3 divide-x divide-white/5 py-3 text-sm">
            {info.map(([k, v]) => <div key={k} className="min-w-0 px-1"><div className="text-[10px] text-white/40">{k}</div><div className="truncate font-bold">{v}</div></div>)}
          </Card>
          <Card className="mt-2 grid grid-cols-3 divide-x divide-white/5 py-3 text-sm">
            {info2.map(([k, v]) => <div key={k} className="min-w-0 px-1"><div className="text-[10px] text-white/40">{k}</div><div className="truncate font-bold">{v}</div></div>)}
          </Card>
          <Btn className="mt-6 w-full py-4 text-base" onClick={finish}>메인 로비 입장하기 <Icon name="ArrowRight" size={18} /></Btn>
        </div>
      </div>
    );
  }

  return (
    <div className="court-bg min-h-[100dvh]">
      <div className="flex min-h-[100dvh] flex-col px-5 pb-8 pt-6">
        <div className="flex items-center justify-between">
          <button onClick={() => (step === 0 ? dispatch({ type: 'LOGOUT' }) : setStep(step - 1))} className="rounded-full p-2 text-white/60 hover:bg-white/10 active:scale-90" aria-label="뒤로">
            <Icon name="ChevronLeft" size={22} />
          </button>
          <div className="text-xs font-bold text-white/40">{step + 1} / {TOTAL} · {steps[step]}</div>
        </div>
        <div className="mt-3 flex gap-1.5">
          {steps.map((s, i) => <div key={s} className={`h-1 flex-1 rounded-full transition-all ${i <= step ? 'bg-brand' : 'bg-white/10'}`} />)}
        </div>

        <div key={step} className="slide-up mt-8 flex-1">
          {step === 0 && (
            <>
              <div className="text-xs font-bold tracking-widest text-brand">STEP 1 · BASIC INFO</div>
              <h1 className="mt-2 text-2xl font-extrabold leading-snug">반가워요!<br />기본 인적사항을 알려주세요</h1>
              <p className="mt-2 text-sm text-white/45">실명과 생년월일은 매니저 출석 확인용으로만 사용되며 다른 유저에게 공개되지 않아요.</p>
              <div className="mt-7 space-y-4">
                <div>
                  <label className="mb-1.5 block text-xs font-bold text-white/55">이름 (실명)</label>
                  <div className="relative">
                    <input autoFocus value={f.realName} maxLength={5} onChange={(e) => set('realName', e.target.value.replace(/\s/g, ''))}
                      onKeyDown={(e) => e.key === 'Enter' && next()} placeholder="예) 김가비" className={inputCls} />
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-white/30">{f.realName.length}/5</span>
                  </div>
                </div>
                <div>
                  <label className="mb-1.5 block text-xs font-bold text-white/55">성별</label>
                  <div className="grid grid-cols-2 gap-2.5">
                    {[['M', '남성', '♂', '#38BDF8'], ['F', '여성', '♀', '#F472B6']].map(([id, label, sym, c]) => {
                      const on = f.gender === id;
                      return (
                        <button key={id} type="button" onClick={() => { set('gender', id); vibrate(8); }}
                          className={`flex h-20 items-center justify-center gap-2.5 rounded-2xl border text-lg font-extrabold transition active:scale-95 ${on ? 'bg-panel2' : 'border-white/[.06] bg-panel text-white/50'}`}
                          style={on ? { borderColor: c, boxShadow: `0 0 0 1px ${c}, 0 10px 26px -14px ${c}`, color: c } : {}}>
                          <span className="text-3xl leading-none">{sym}</span>{label}
                        </button>
                      );
                    })}
                  </div>
                </div>
                <Card className="p-4">
                  <div className="flex items-center justify-between">
                    <label htmlFor="onboard-birthdate" className="flex items-center gap-2 text-sm font-bold text-white/70">
                      <Icon name="Calendar" size={16} className="text-brand" />생년월일 (YYYY-MM-DD)
                    </label>
                    <span className="rounded-full bg-brand/15 px-2.5 py-0.5 text-xs font-extrabold text-brand">(만 {manAge}세)</span>
                  </div>
                  <input id="onboard-birthdate" type="date" min="1950-01-01" max="2015-12-31" value={f.birthDate}
                    onChange={(e) => set('birthDate', e.target.value)}
                    className="mt-3 w-full rounded-xl border border-white/10 bg-ink px-4 py-3.5 font-mono text-base font-bold outline-none transition focus:border-brand" />
                  <div className="mt-2 flex items-center justify-between text-xs text-white/50">
                    <span>선택한 생년월일 기준</span>
                    <b className="text-neon">현재 만 {manAge}세 (만 {manAge}세)</b>
                  </div>
                </Card>
              </div>
            </>
          )}

          {step === 1 && (
            <>
              <div className="text-xs font-bold tracking-widest text-brand">STEP 2 · NICKNAME</div>
              <h1 className="mt-2 text-2xl font-extrabold leading-snug">코트에서 불릴<br />닉네임을 정해주세요</h1>
              <p className="mt-2 text-sm text-white/45">매치 명단과 랭킹 보드에 표시됩니다.</p>
              <div className="relative mt-8">
                <input autoFocus value={f.nickname} maxLength={10} onChange={(e) => set('nickname', e.target.value)} onKeyDown={(e) => e.key === 'Enter' && next()}
                  placeholder="예) 세종의커리" className={inputCls} />
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-white/30">{f.nickname.length}/10</span>
              </div>
              <div className="mt-3 flex flex-wrap items-center gap-2 text-xs">
                <span className="text-white/40">추천:</span>
                {['세종의커리', '동네조던', '코트의마법사', '골밑지배자'].map((nick) => (
                  <button key={nick} type="button" onClick={() => set('nickname', nick)}
                    className="rounded-full border border-white/10 bg-white/5 px-2.5 py-1 text-white/70 transition hover:border-brand hover:text-brand active:scale-95">
                    +{nick}
                  </button>
                ))}
              </div>
            </>
          )}

          {step === 2 && (
            <>
              <div className="text-xs font-bold tracking-widest text-brand">STEP 3 · BODY &amp; REGION</div>
              <h1 className="mt-2 text-2xl font-extrabold leading-snug">신체 프로필과<br />주 활동 지역을 알려주세요</h1>
              <div className="mt-7 space-y-4">
                {[['height', '신장', 'cm', 150, 210, 'Ruler'], ['weight', '체중', 'kg', 45, 130, 'Dumbbell']].map(([k, label, unit, mn, mx, ic]) => (
                  <Card key={k} className="p-4">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2 text-sm font-bold text-white/70"><Icon name={ic} size={16} className="text-brand" />{label}</div>
                      <div className="flex items-baseline gap-1">
                        <input type="number" inputMode="numeric" value={f[k]} onChange={(e) => set(k, e.target.value)}
                          className="w-20 rounded-lg bg-ink px-2 py-1 text-right font-bebas text-3xl text-brand outline-none" />
                        <span className="text-sm text-white/40">{unit}</span>
                      </div>
                    </div>
                    <input type="range" min={mn} max={mx} value={clamp(+f[k] || mn, mn, mx)} onChange={(e) => set(k, +e.target.value)} className="mt-3 w-full" />
                  </Card>
                ))}
                <Card className="p-4">
                  <div className="flex items-center gap-2 text-sm font-bold text-white/70"><Icon name="MapPin" size={16} className="text-brand" />주 활동 지역</div>
                  <div className="mt-3 grid grid-cols-2 gap-2">
                    <select value={f.city} onChange={(e) => setF((p) => ({ ...p, city: e.target.value, district: REGIONS[e.target.value][0] }))}
                      className="rounded-xl border border-white/10 bg-ink px-3 py-3 text-sm font-bold outline-none focus:border-brand">
                      {Object.keys(REGIONS).map((c) => <option key={c}>{c}</option>)}
                    </select>
                    <select value={f.district} onChange={(e) => set('district', e.target.value)}
                      className="rounded-xl border border-white/10 bg-ink px-3 py-3 text-sm font-bold outline-none focus:border-brand">
                      {REGIONS[f.city].map((d) => <option key={d}>{d}</option>)}
                    </select>
                  </div>
                </Card>
              </div>
            </>
          )}

          {step === 3 && (
            <>
              <div className="text-xs font-bold tracking-widest text-brand">STEP 4 · POSITION</div>
              <h1 className="mt-2 text-2xl font-extrabold leading-snug">주 포지션을<br />선택해주세요</h1>
              <p className="mt-2 text-sm text-white/45">팀 밸런스 배정과 플레이 스타일 분석에 활용됩니다. (마이페이지에서 세부 포지션 변경 가능)</p>
              <div className="mt-7 space-y-3">
                {ONBOARD_POSITIONS.map((p) => {
                  const on = f.position === p.id;
                  return (
                    <button key={p.id} onClick={() => { set('position', p.id); vibrate(8); }}
                      className={`relative flex w-full items-center gap-4 overflow-hidden rounded-2xl border p-4 text-left transition active:scale-[.98] ${on ? 'bg-panel2' : 'border-white/[.06] bg-panel hover:border-white/20'}`}
                      style={on ? { borderColor: p.color, boxShadow: `0 0 0 1px ${p.color}, 0 10px 30px -12px ${p.color}` } : {}}>
                      <div className="absolute -right-3 -top-4 font-bebas text-8xl leading-none opacity-[.07]" style={{ color: p.color }}>{p.id}</div>
                      <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl" style={{ background: `${p.color}1F`, color: p.color }}>
                        <Icon name={p.icon} size={28} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="flex items-baseline gap-2"><span className="text-lg font-extrabold">{p.name}</span><span className="font-bebas text-sm tracking-widest text-white/40">{p.en}</span></div>
                        <div className="mt-0.5 text-xs text-white/50">{p.desc}</div>
                      </div>
                      <div className={`flex h-6 w-6 items-center justify-center rounded-full border-2 ${on ? '' : 'border-white/20'}`} style={on ? { borderColor: p.color, background: p.color } : {}}>
                        {on && <Icon name="Check" size={14} strokeWidth={3} className="text-black" />}
                      </div>
                    </button>
                  );
                })}
              </div>
            </>
          )}
        </div>

        <Btn className="mt-6 w-full py-4 text-base" onClick={next}>
          {step === TOTAL - 1 ? '프로필 완성하기' : '다음'} <Icon name="ArrowRight" size={18} />
        </Btn>
      </div>
    </div>
  );
}

/* ---------- ProfileEditModal (마이페이지 프로필 수정 모달) ---------- */
function ProfileEditModal({ open, onClose }) {
  const { state, dispatch, toast } = useStore();
  const me = state.users[state.meId];
  const initPos = (pos) => (pos === 'G' ? 'PG' : pos === 'F' ? 'SF' : pos || 'PG');
  const [f, setF] = useState(() => ({
    nickname: me ? me.nickname : '',
    birthDate: me && me.birthDate ? me.birthDate : '1999-05-15',
    gender: me && me.gender ? me.gender : 'M',
    height: me ? me.height : 178,
    weight: me ? me.weight : 72,
    city: me ? me.city : '세종특별자치시',
    district: me ? me.district : '조치원읍',
    position: me ? initPos(me.position) : 'PG',
  }));

  useEffect(() => {
    if (open && me) {
      setF({
        nickname: me.nickname || '',
        birthDate: me.birthDate || '1999-05-15',
        gender: me.gender || 'M',
        height: me.height || 178,
        weight: me.weight || 72,
        city: me.city || '세종특별자치시',
        district: me.district || (REGIONS[me.city]?.[0] || '조치원읍'),
        position: initPos(me.position),
      });
    }
  }, [open]);

  if (!me) return null;
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const manAge = calcAge(f.birthDate, me.age);

  const save = (e) => {
    e && e.preventDefault();
    const n = f.nickname.trim();
    if (n.length < 2 || n.length > 10) return toast('닉네임은 2~10자로 입력해주세요', 'error');
    if (Object.values(state.users).some((u) => u.id !== me.id && u.nickname === n)) {
      return toast('이미 다른 선수가 사용 중인 닉네임입니다', 'error');
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.birthDate)) return toast('생년월일(YYYY-MM-DD)을 확인해주세요', 'error');
    if (+f.height < 140 || +f.height > 230 || +f.weight < 35 || +f.weight > 160) {
      return toast('신장(140~230cm) 및 체중(35~160kg) 범위를 확인해주세요', 'error');
    }
    if (!f.position || !POSITIONS[f.position]) return toast('주 포지션을 선택해주세요', 'error');
    dispatch({
      type: 'UPDATE_PROFILE',
      profile: {
        nickname: n,
        birthDate: f.birthDate,
        age: manAge,
        gender: f.gender,
        height: +f.height,
        weight: +f.weight,
        city: f.city,
        district: f.district,
        position: f.position,
      },
    });
    vibrate(12);
    toast('프로필 정보가 성공적으로 수정되었습니다 ✨', 'success');
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="✏️ 프로필 수정">
      <form onSubmit={save} className="space-y-4 p-5">
        <div>
          <label className="mb-1.5 block text-xs font-extrabold text-white/55">코트 닉네임 (2~10자)</label>
          <div className="relative">
            <input value={f.nickname} maxLength={10} onChange={(e) => set('nickname', e.target.value)}
              placeholder="닉네임 입력" className="w-full rounded-xl border border-white/10 bg-ink px-4 py-3 text-sm font-bold outline-none focus:border-brand" />
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] text-white/35">{f.nickname.length}/10</span>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2.5">
          <div>
            <div className="mb-1.5 flex items-center justify-between text-xs font-extrabold text-white/55">
              <span>생년월일</span>
              <span className="text-brand">(만 {manAge}세)</span>
            </div>
            <input type="date" min="1950-01-01" max="2015-12-31" value={f.birthDate} onChange={(e) => set('birthDate', e.target.value)}
              className="w-full rounded-xl border border-white/10 bg-ink px-3 py-2.5 font-mono text-xs font-bold outline-none focus:border-brand" />
          </div>
          <div>
            <label className="mb-1.5 block text-xs font-extrabold text-white/55">성별</label>
            <div className="grid grid-cols-2 gap-1.5">
              {[['M', '남성', '#38BDF8'], ['F', '여성', '#F472B6']].map(([id, label, c]) => {
                const on = f.gender === id;
                return (
                  <button key={id} type="button" onClick={() => set('gender', id)}
                    className={`rounded-xl border py-2.5 text-xs font-extrabold transition ${on ? 'bg-panel2' : 'border-white/10 bg-ink text-white/50'}`}
                    style={on ? { borderColor: c, color: c, boxShadow: `0 0 0 1px ${c}` } : {}}>
                    {label}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2.5">
          {[['height', '신장', 'cm', 150, 210], ['weight', '체중', 'kg', 45, 130]].map(([k, label, unit, mn, mx]) => (
            <div key={k} className="rounded-xl border border-white/[.06] bg-ink/60 p-3">
              <div className="flex items-center justify-between text-xs font-bold text-white/60">
                <span>{label}</span>
                <div className="flex items-baseline gap-0.5">
                  <input type="number" inputMode="numeric" value={f[k]} onChange={(e) => set(k, e.target.value)}
                    className="w-14 rounded bg-panel px-1.5 py-0.5 text-right font-bebas text-xl text-brand outline-none" />
                  <span className="text-[10px] text-white/40">{unit}</span>
                </div>
              </div>
              <input type="range" min={mn} max={mx} value={clamp(+f[k] || mn, mn, mx)} onChange={(e) => set(k, +e.target.value)} className="mt-2 w-full" />
            </div>
          ))}
        </div>

        <div>
          <label className="mb-1.5 block text-xs font-extrabold text-white/55">주 활동 지역</label>
          <div className="grid grid-cols-2 gap-2">
            <select value={f.city} onChange={(e) => setF((p) => ({ ...p, city: e.target.value, district: REGIONS[e.target.value][0] }))}
              className="rounded-xl border border-white/10 bg-ink px-3 py-2.5 text-xs font-bold outline-none focus:border-brand">
              {Object.keys(REGIONS).map((c) => <option key={c}>{c}</option>)}
            </select>
            <select value={f.district} onChange={(e) => set('district', e.target.value)}
              className="rounded-xl border border-white/10 bg-ink px-3 py-2.5 text-xs font-bold outline-none focus:border-brand">
              {(REGIONS[f.city] || []).map((d) => <option key={d}>{d}</option>)}
            </select>
          </div>
        </div>

        <div>
          <label className="mb-1.5 block text-xs font-extrabold text-white/55">주 포지션 (PG / SG / SF / PF / C)</label>
          <div className="grid grid-cols-1 gap-2">
            {DETAIL_POSITIONS.map((p) => {
              const on = f.position === p.id;
              return (
                <button key={p.id} type="button" onClick={() => { set('position', p.id); vibrate(6); }}
                  className={`flex items-center gap-3 rounded-xl border p-2.5 text-left transition active:scale-[.99] ${on ? 'bg-panel2' : 'border-white/[.06] bg-ink/60 hover:border-white/20'}`}
                  style={on ? { borderColor: p.color, boxShadow: `0 0 0 1px ${p.color}` } : {}}>
                  <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl font-bebas text-lg font-black" style={{ background: `${p.color}22`, color: p.color }}>
                    {p.id}
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs font-extrabold">{p.name}</span>
                      <span className="font-bebas text-[11px] tracking-wider text-white/40">{p.en}</span>
                    </div>
                    <div className="truncate text-[11px] text-white/50">{p.desc}</div>
                  </div>
                  <div className={`flex h-5 w-5 items-center justify-center rounded-full border ${on ? '' : 'border-white/20'}`}
                    style={on ? { borderColor: p.color, background: p.color } : {}}>
                    {on && <Icon name="Check" size={12} strokeWidth={3} className="text-black" />}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2 pt-2">
          <Btn type="button" variant="ghost" onClick={onClose}>취소</Btn>
          <Btn type="submit"><Icon name="Check" size={16} /> 저장하기</Btn>
        </div>
      </form>
    </Modal>
  );
}

/* ---------- MatchDetailModal (매치 상세 보기 & 길찾기 연동 모달) ---------- */
function MatchDetailModal({ match, open, onClose }) {
  const { state, dispatch, toast } = useStore();
  if (!match) return null;
  const m = state.matches.find((x) => x.id === match.id) || match;
  const joined = m.participants.includes(state.meId);
  const st = matchStatus(m);
  const unlimited = isUnlimitedMatch(m);
  const left = unlimited ? 999 : m.maxPlayers - m.participants.length;
  const addr = getCourtAddress(m, state);

function DemoGuide() {

  const applied = state.matches.some((m) => m.participants.includes(state.meId));
  const played = me.totals.gp > 0;
  const viewed = played && state.seenMatchId && me.games[0] && state.seenMatchId === me.games[0].matchId;
  const steps = [
    { t: '온보딩 & 초기 레이팅 부여', done: true },
    { t: '오픈 매치 참가 신청', done: applied },
    { t: '매니저 콘솔: 팀 배정 · 터치 스탯 입력 · 공식 기록 전송', done: played },
    { t: '마이페이지에서 티어 · 레이더 · 모멘텀 확인', done: viewed },

      </button>
      {open && (
        <div className="border-t border-white/5 px-4 pb-4 pt-3">
          <ol className="space-y-2">
            {steps.map((s, i) => (
              <li key={i} className={`flex items-center gap-2.5 text-xs ${s.done ? 'text-white/40' : i === cur ? 'font-bold text-white' : 'text-white/50'}`}>
                <span className={`flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[10px] font-black ${s.done ? 'bg-neon text-black' : i === cur ? 'bg-brand text-black' : 'bg-white/10'}`}>
                  {s.done ? <Icon name="Check" size={12} strokeWidth={3.5} /> : i + 1}
                </span>
                <span className={s.done ? 'line-through' : ''}>{s.t}</span>
              </li>

          {cur === 2 && (

              <b className="text-brand">🛡️ 매니저 기록 대기 중</b> · 담당 매니저가 별도의 직원 전용 콘솔에서 팀 배정 · 스탯 기록 · 공식 전송을 진행합니다. 전송되는 즉시 이 화면에 자동 반영돼요.
            </div>
          )}
          {cur === 3 && (
            <button onClick={() => setTab('my')} className="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-neon/15 px-3 py-2.5 text-xs font-extrabold text-neon hover:bg-neon/25">

    .filter((m) => m.status !== 'finished' && m.status !== 'cancelled')
    .filter((m) => {

function GameRow({ g, onClick }) {

  const my = g.team === 'A' ? g.score.A : g.score.B, op = g.team === 'A' ? g.score.B : g.score.A;
  return (
    <button onClick={onClick} className="flex w-full items-center gap-3 rounded-2xl border border-white/[.06] bg-panel p-3 text-left transition hover:border-white/15">

    </div>

        <div className="text-center"><div className="font-bebas text-lg text-brand">TEAM A</div><div className={`font-bebas text-6xl leading-none ${r.winner === 'A' ? 'text-white' : 'text-white/40'}`}>{r.scoreA}</div>{r.winner === 'A' && <div className="text-[10px] font-black text-neon">WIN</div>}</div>
        <div className="text-center"><div className="font-bebas text-xl text-white/30">FINAL</div><div className="text-[10px] text-white/35">{fmtShort(match.datetime)}</div></div>
        <div className="text-center"><div className="font-bebas text-lg text-teamb">TEAM B</div><div className={`font-bebas text-6xl leading-none ${r.winner === 'B' ? 'text-white' : 'text-white/40'}`}>{r.scoreB}</div>{r.winner === 'B' && <div className="text-[10px] font-black text-neon">WIN</div>}</div>
      </div>
      {meRow && (
        <div className="mt-4 flex items-center gap-3 rounded-xl border border-neon/30 bg-neon/[.06] p-3">
          <Avatar user={state.users[state.meId]} size={36} ring />
          <div className="min-w-0 flex-1 text-xs">
            <div className="font-extrabold">내 캐릭터 결과 · {meRow.result === 'W' ? '승리' : meRow.result === 'L' ? '패배' : '무승부'}</div>
            <div className="text-white/50">ABEi {meRow.abei.toFixed(1)} · 가중치 ×{meRow.weight.toFixed(2)} · {meRow.before} → <b className="text-white">{meRow.after}</b>{meRow.tierAfter !== meRow.tierBefore && <b className="ml-1 text-neon">🚀 {getTier(meRow.after).name} 승급!</b>}</div>
          </div>
          <DeltaChip delta={meRow.delta} />
        </div>
      )}
      {['A', 'B'].map((t) => (
        <div key={t} className="mt-4">
          <div className="mb-1.5 flex items-center justify-between text-xs font-bold">
            <span className={t === 'A' ? 'text-brand' : 'text-teamb'}>TEAM {t} {r.winner === t ? '· 승리 🏆' : r.winner === 'D' ? '· 무승부' : '· 패배'}</span>
            <span className="text-white/40">팀 평균 ABEi {r.teamAvgs ? r.teamAvgs[t].toFixed(2) : '-'} ({r.rows.filter((x) => x.team === t).length}명)</span>
          </div>
          <div className="overflow-x-auto rounded-xl border border-white/5">
            <table className="w-full min-w-[560px] text-[11px]">
              <thead className="bg-white/[.03] text-white/40">
                <tr>{['선수', 'PTS', 'REB', 'AST', 'STL', 'BLK', 'TOV', 'PF', 'ABEi', 'weight', 'Δ PT', '레이팅'].map((h) => <th key={h} className="px-2 py-2 text-center font-bold first:text-left">{h}</th>)}</tr>
              </thead>
              <tbody className="divide-y divide-white/5">
                {r.rows.filter((x) => x.team === t).sort((a, b) => b.delta - a.delta).map((x) => (
                  <tr key={x.id} className={x.id === state.meId ? 'bg-neon/[.06]' : ''}>
                    <td className="px-2 py-2 font-bold"><span className="whitespace-nowrap">{x.nickname}{x.id === state.meId && <span className="ml-1 text-neon">(나)</span>}</span></td>
                    {STAT_KEYS.map((k) => <td key={k} className={`px-2 py-2 text-center font-mono ${k === 'pts' ? 'font-bold text-brand' : (k === 'pf' && x.stats.pf >= 4) ? 'text-red-400' : 'text-white/70'}`}>{x.stats[k]}</td>)}
                    <td className="px-2 py-2 text-center font-mono font-bold">{x.abei.toFixed(1)}</td>
                    <td className="px-2 py-2 text-center font-mono text-yellow-300">×{x.weight.toFixed(2)}</td>
                    <td className={`px-2 py-2 text-center font-bebas text-base ${x.delta >= 0 ? 'text-neon' : 'text-red-400'}`}>{signed(x.delta)}</td>
                    <td className="whitespace-nowrap px-2 py-2 text-center"><span className="font-bebas text-base">{x.after}</span> {x.tierAfter !== x.tierBefore && <span className="text-[9px] font-black" style={{ color: getTier(x.after).color }}>{tierIndex(x.tierAfter) > tierIndex(x.tierBefore) ? '▲' : '▼'}{getTier(x.after).name}</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))}
      <div className="mt-4 rounded-xl bg-ink p-3 font-mono text-[10px] leading-relaxed text-white/45">
        ABEi = PTS + 1.5·REB + 2·AST + 2·STL + 2·BLK − 2·TOV − PF<br />
        weight = clip(ABEi ÷ 팀평균ABEi, 0.5, 1.5) · 승리 Δ = +25 × w · 패배 Δ = −20 ÷ w
      </div>
      {onDashboard && meRow && (
        <Btn variant="neon" className="mt-4 w-full py-3.5" onClick={onDashboard}><Icon name="ChartLine" size={16} /> 유저 모드로 전환 → 내 대시보드에서 확인하기</Btn>
      )}
    </div>
  );
}

/* =====================================================================
 * 16. APP ROOT (유저 앱 · 모바일 앱 쉘)
 * ===================================================================== */
function App() {
  const [state, dispatch] = useReducer(reducer, null, loadState);
  const [tab, setTabRaw] = useState(() => (location.hash === '#my' ? 'my' : 'lobby'));
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('gt_theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } });
  const [toasts, setToasts] = useState([]);
  const [guideOpen, setGuideOpen] = useState(false);

  useSharedPersistence(state, dispatch, setTheme);

  useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('gt_theme', theme); } catch (e) {}
    const meta = document.getElementById('meta-theme');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#F6F7F9' : '#121212');
  }, [theme]);

  const toast = useCallback((msg, type = 'info') => {
    const id = Math.random();
    setToasts((t) => [...t.slice(-2), { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2600);
  }, []);
  const setTab = useCallback((t) => { setTabRaw(t); window.scrollTo({ top: 0, behavior: 'smooth' }); }, []);

  useEffect(() => { if (!state.auth) setTabRaw('lobby'); }, [state.auth]);

  // 로그인 및 온보딩 완료 후 메인 화면 진입 시 첫 방문 이용 가이드 자동 노출
  const isOnboarded = Boolean(state.auth && state.meId && state.users[state.meId]);
  useEffect(() => {
    if (isOnboarded) {
      try {
        if (localStorage.getItem('gt_guide_seen') !== 'true') {
          setGuideOpen(true);
        }
      } catch (e) {}
    } else {
      setGuideOpen(false);
    }
  }, [isOnboarded]);

  const openGuide = useCallback(() => setGuideOpen(true), []);
  const closeGuide = useCallback(() => {
    try { localStorage.setItem('gt_guide_seen', 'true'); } catch (e) {}
    setGuideOpen(false);
  }, []);

  // 매니저 콘솔(admin.html)에서 공식 기록이 전송되면 실시간 알림
  const me = state.meId ? state.users[state.meId] : null;
  const latestId = me && me.games && me.games[0] ? me.games[0].matchId : null;
  const prevLatest = useRef(latestId);
  useEffect(() => {
    if (latestId && prevLatest.current !== latestId) {
      let on = true; try { on = readNotify().stat; } catch (e) {}
      if (on) toast('🏁 매니저가 공식 기록을 전송했어요! 마이페이지에서 확인하세요', 'success');
    }
    prevLatest.current = latestId;
  }, [latestId]);

  // 매니저 콘솔(admin.html)에서 새 매치가 개설되면 실시간 알림
  const mgrMatchCount = (state.matches || []).filter((m) => isManagerMatch(m)).length;
  const prevMgrCount = useRef(mgrMatchCount);
  useEffect(() => {
    if (mgrMatchCount > prevMgrCount.current) {
      const newest = (state.matches || []).find((m) => isManagerMatch(m));
      toast(`🏀 새 매치가 개설되었습니다: ${newest ? newest.title : '신규 매치'}`, 'success');
    }
    prevMgrCount.current = mgrMatchCount;
  }, [mgrMatchCount]);

  const ctx = { state, dispatch, tab, setTab, toast, theme, setTheme, openGuide };

  let screen;
  if (!state.auth) screen = <LoginScreen />;
  else if (!state.meId || !state.users[state.meId]) screen = <Onboarding />;
  else {
    let page;
    if (tab === 'mymatch') page = <MyMatchesPage />;
    else if (tab === 'ranking') page = <RankingPage />;
    else if (tab === 'my') page = <MyPage />;
    else page = <LobbyPage />;
    screen = (
      <div className="min-h-[100dvh]">
        <Header />
        <main key={tab} className="fade-in px-4 pb-28 pt-4">{page}</main>
        <BottomNav />
      </div>
    );
  }

  return (
    <Store.Provider value={ctx}>
      {/* 모바일 앱 쉘: PC/태블릿에서도 480px 폭으로 중앙 정렬 (overflow-x-clip: sticky 헤더 유지) */}
      <div className="app-shell court-bg relative mx-auto min-h-[100dvh] w-full max-w-[480px] overflow-x-clip">
        {screen}
      </div>
      <WelcomeGuideModal open={guideOpen && isOnboarded} onClose={closeGuide} />
      <Toasts items={toasts} />
    </Store.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div style={{ padding: 24, color: '#fff', background: '#121212', minHeight: '100vh', fontFamily: 'sans-serif' }}>
          <h2 style={{ color: '#FF5500' }}>문제가 발생했습니다</h2>
          <pre style={{ whiteSpace: 'pre-wrap', fontSize: 12, opacity: .7 }}>{String(this.state.err && this.state.err.stack || this.state.err)}</pre>
          <button style={{ marginTop: 12, padding: '10px 16px', background: '#FF5500', border: 0, borderRadius: 10, fontWeight: 800 }}
            onClick={() => { localStorage.removeItem(STORAGE_KEY); location.reload(); }}>데이터 초기화 후 새로고침</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
